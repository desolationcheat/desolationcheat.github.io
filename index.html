<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DESOLATION // PROJECT</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@300;500&display=swap');

        :root {
            --neon-pink: #ffb6c1;
            --dark-bg: #030303;
            --panel: #0a0a0a;
            --brd: #1a1a1a;
            --glow: 0 0 20px rgba(255, 182, 193, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { background: var(--dark-bg); color: #eee; font-family: 'JetBrains Mono', monospace; overflow: hidden; }

        /* СТАРОЕ ИНТРО */
        #intro {
            position: fixed; inset: 0; background: #000; z-index: 3000;
            display: flex; justify-content: center; align-items: center;
            animation: fadeOut 1.5s ease 2s forwards;
        }
        .intro-title {
            font-family: 'Orbitron'; font-size: 5rem; color: var(--neon-pink);
            text-shadow: var(--glow); letter-spacing: 15px;
            opacity: 0; animation: fadeInOut 2s ease forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.9); filter: blur(10px); }
            50% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.1); filter: blur(5px); }
        }
        @keyframes fadeOut { to { visibility: hidden; opacity: 0; } }

        /* АНИМАЦИЯ ПЕЧАТИ И ПОЯВЛЕНИЯ */
        .char { display: inline-block; opacity: 0; transform: translateY(5px); animation: charFade 0.3s forwards; }
        @keyframes charFade { to { opacity: 1; transform: translateY(0); } }

        /* КНОПКИ ПОКУПКИ (КАК НА СКРИНШОТЕ) */
        .shop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .buy-box {
            border: 1px solid var(--brd); background: #000; padding: 25px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
            text-decoration: none; color: #fff; font-family: 'Orbitron';
            font-size: 0.8rem; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .buy-box:hover { border-color: var(--neon-pink); box-shadow: var(--glow); transform: translateY(-3px); }
        .buy-box i { font-size: 1rem; color: var(--neon-pink); }

        /* КРАСИВЫЙ UID */
        .uid-container {
            display: inline-flex; align-items: center; background: rgba(255,182,193,0.05);
            border: 1px solid rgba(255,182,193,0.2); padding: 8px 15px;
            margin-top: 10px; position: relative;
        }
        .uid-label { font-size: 0.6rem; color: #444; margin-right: 10px; letter-spacing: 2px; }
        .uid-number { color: var(--neon-pink); font-weight: 900; text-shadow: var(--glow); font-size: 1.1rem; }

        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(3,3,3,0.9); border-bottom: 1px solid var(--brd); z-index: 1000; backdrop-filter: blur(10px);
        }

        .nav-link { cursor: pointer; color: #666; transition: 0.3s; display: flex; align-items: center; gap: 10px; font-size: 0.75rem; text-decoration: none; }
        .nav-link:hover, .nav-link.active { color: var(--neon-pink); text-shadow: var(--glow); }

        #auth-page { position: fixed; inset: 0; background: var(--dark-bg); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--panel); border: 1px solid var(--brd); padding: 50px; width: 400px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid var(--brd); padding: 15px; color: #fff; margin-bottom: 15px; font-family: inherit; }
        .btn { width: 100%; padding: 15px; background: var(--neon-pink); color: #000; border: none; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; }

        main { display: none; padding: 120px 20px 50px; flex-direction: column; align-items: center; height: 100vh; overflow-y: auto; }
        .content-box { width: 100%; max-width: 900px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="intro"><div class="intro-title">DESOLATION</div></div>

    <section id="auth-page">
        <div class="auth-card">
            <h2 class="neon-txt anim-type" data-text="IDENTIFICATION" style="margin-bottom: 30px;"></h2>
            <div id="box-l">
                <input type="text" id="l-u" placeholder="LOGIN">
                <input type="password" id="l-p" placeholder="PASSWORD">
                <button class="btn" onclick="login()">EXECUTE</button>
                <p style="font-size: 0.6rem; color: #333; margin-top: 20px; cursor: pointer;" onclick="swap(true)">[ CREATE ACCESS ]</p>
            </div>
            <div id="box-r" class="hidden">
                <input type="text" id="r-u" placeholder="USERNAME">
                <input type="password" id="r-p" placeholder="PASSWORD">
                <input type="text" id="r-i" placeholder="INVITE CODE">
                <button class="btn" onclick="register()">REGISTER</button>
                <p style="font-size: 0.6rem; color: #333; margin-top: 20px; cursor: pointer;" onclick="swap(false)">[ BACK ]</p>
            </div>
        </div>
    </section>

    <nav>
        <div class="neon-txt anim-type" data-text="DESOLATION" style="font-size: 1.4rem; cursor:pointer;" onclick="tab('h')"></div>
        <div style="display: flex; gap: 30px;">
            <div class="nav-link active" onclick="tab('h')" id="n-h"><i class="fa-solid fa-terminal"></i> <span class="anim-type" data-text="HOME"></span></div>
            <div class="nav-link" onclick="tab('p')" id="n-p"><i class="fa-solid fa-user"></i> <span class="anim-type" data-text="PROFILE"></span></div>
            <a href="https://t.me/desolation_samp" class="nav-link" target="_blank"><i class="fa-brands fa-telegram"></i> <span class="anim-type" data-text="TELEGRAM"></span></a>
        </div>
    </nav>

    <main id="app">
        <div id="vh" class="content-box">
            <div style="background: var(--panel); border: 1px solid var(--brd); padding: 30px; border-left: 3px solid var(--neon-pink); margin-bottom: 30px;">
                <h3 class="neon-txt anim-type" data-text="SYSTEM_OVERVIEW" style="font-size: 0.9rem; margin-bottom: 15px;"></h3>
                <p class="anim-type" data-text="Silent Aim, Wallshot, ESP Bones, Lines и самый плавный розовый интерфейс на mimgui. Полная доминация в SAMP под твоим контролем." style="font-size: 0.8rem; color: #666; line-height: 1.6;"></p>
            </div>

            <div class="shop-row">
                <a href="#" class="buy-box">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="anim-type" data-text="BUY 7 DAYS (150₽)"></span>
                </a>
                <a href="#" class="buy-box">
                    <i class="fa-solid fa-crown"></i>
                    <span class="anim-type" data-text="BUY 30 DAYS (400₽)"></span>
                </a>
            </div>
        </div>

        <div id="vp" class="content-box hidden">
            <div style="background: var(--panel); border: 1px solid var(--brd); padding: 40px;">
                <h2 class="neon-txt anim-type" id="u-display" data-text="USER"></h2>
                <div class="uid-container">
                    <span class="uid-label">IDENTIFIER</span>
                    <span class="uid-number" id="u-uid">000</span>
                </div>

                <div style="margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                    <div><small style="color:#333; display:block">RANK</small><span id="u-rank" class="neon-txt" style="font-size: 0.8rem;">USER</span></div>
                    <div><small style="color:#333; display:block">EXPIRES</small><span style="font-size: 0.8rem; color: #0f0;">LIFETIME</span></div>
                    <div><small style="color:#333; display:block">STATUS</small><span style="font-size: 0.8rem;">ACTIVE</span></div>
                </div>

                <div style="margin-top: 40px; border-top: 1px solid #111; padding-top: 20px;">
                    <p style="font-size: 0.6rem; color: #444; margin-bottom: 10px;">INVITE CODES (LIMIT 2/MONTH)</p>
                    <div id="u-invs" style="font-size: 0.7rem; color: var(--neon-pink); margin-bottom: 15px;">EMPTY</div>
                    <button id="gen-btn" class="btn" style="background:transparent; border:1px solid var(--brd); color:#666; font-size:0.6rem; width:auto; padding:10px 25px;" onclick="gen()">GENERATE</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0", 
            authDomain: "desolationcheat.firebaseapp.com", 
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com", 
            projectId: "desolationcheat" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let user = null, uid = "";

        // СУПЕР ПЛАВНАЯ ПЕЧАТЬ
        function startTyping(el) {
            const text = el.getAttribute('data-text');
            if (!text) return;
            el.innerHTML = "";
            text.split("").forEach((char, i) => {
                const span = document.createElement("span");
                span.textContent = char === " " ? "\u00A0" : char;
                span.className = "char";
                span.style.animationDelay = `${i * 0.03}s`;
                el.appendChild(span);
            });
        }

        function refreshTyping() {
            document.querySelectorAll('.anim-type').forEach(el => {
                if (!el.closest('.hidden')) startTyping(el);
            });
        }

        function swap(r) {
            document.getElementById('box-l').classList.toggle('hidden', r);
            document.getElementById('box-r').classList.toggle('hidden', !r);
            refreshTyping();
        }

        async function login() {
            const u = document.getElementById('l-u').value.toLowerCase().trim();
            const p = document.getElementById('l-p').value.trim();
            const s = await db.ref('users/'+u).get();
            if(s.exists() && s.val().password === p) {
                uid = u; user = s.val(); 
                document.getElementById('auth-page').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                load();
            } else alert("INVALID ACCESS");
        }

        async function register() {
            const u = document.getElementById('r-u').value.toLowerCase().trim();
            const p = document.getElementById('r-p').value.trim(), i = document.getElementById('r-i').value.trim();
            const inv = await db.ref('invites/'+i).get();
            
            if(inv.exists() && inv.val().active) {
                const count = (await db.ref('stats/userCount').get()).val() || 0;
                const role = (u === 'ryodeu' || u === 'dev') ? "None" : "USER"; 
                await db.ref('users/'+u).set({ password: p, by: inv.val().gen_by, date: new Date().toLocaleDateString(), uid: count + 1, rank: role, gen_count: 0, last_gen: new Date().getMonth() });
                await db.ref('invites/'+i).update({ active: false });
                await db.ref('stats/userCount').set(count + 1);
                alert("SUCCESS"); swap(false);
            } else alert("INVALID INVITE");
        }

        function load() {
            document.getElementById('u-display').setAttribute('data-text', uid.toUpperCase());
            document.getElementById('u-uid').innerText = String(user.uid).padStart(3, '0');
            document.getElementById('u-rank').innerText = user.rank || "USER";
            document.getElementById('u-invs').innerText = (user.invs || []).join(' | ') || "NO CODES";
            
            const curM = new Date().getMonth();
            if(user.last_gen !== curM) db.ref('users/'+uid).update({ gen_count: 0, last_gen: curM });
            if(user.gen_count >= 2 && user.rank !== 'None') document.getElementById('gen-btn').disabled = true;
            
            refreshTyping();
        }

        async function gen() {
            if(user.gen_count >= 2 && user.rank !== 'None') return;
            const code = "DSL-" + Math.random().toString(36).substring(2,8).toUpperCase();
            await db.ref('invites/'+code).set({ active: true, gen_by: uid });
            let my = user.invs || []; my.push(code);
            await db.ref('users/'+uid).update({ invs: my, gen_count: (user.gen_count || 0) + 1 });
            user.invs = my; user.gen_count++; load();
        }

        function tab(t) {
            document.getElementById('vh').classList.toggle('hidden', t!=='h');
            document.getElementById('vp').classList.toggle('hidden', t!=='p');
            document.getElementById('n-h').classList.toggle('active', t==='h');
            document.getElementById('n-p').classList.toggle('active', t==='p');
            refreshTyping();
        }

        // Запуск печати при загрузке
        setTimeout(refreshTyping, 100);
    </script>
</body>
</html>
