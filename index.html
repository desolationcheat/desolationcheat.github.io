<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Desolation | Auth</title>
    <style>
        :root { --neon: #ffadd2; --bg: #0a0a0a; --card: #111; }
        body { background: var(--bg); color: #eee; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { width: 400px; background: var(--card); border: 1px solid #222; padding: 30px; box-shadow: 0 0 20px rgba(255,173,210,0.1); }
        .neon { color: var(--neon); text-shadow: 0 0 5px var(--neon); text-transform: uppercase; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: none; border: 1px solid var(--neon); color: var(--neon); cursor: pointer; margin-top: 10px; font-weight: bold; }
        .btn-alt { border-color: #444; color: #888; margin-top: 5px; font-size: 12px; }
        .hidden { display: none; }
        .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 14px; }
        .inv-box { background: #050505; padding: 10px; font-family: monospace; color: var(--neon); margin: 10px 0; font-size: 12px; }
    </style>
</head>
<body>

<div class="box">
    <!-- ФОРМА ВХОДА -->
    <div id="login-form">
        <h2 class="neon">Desolation Login</h2>
        <input type="text" id="l-user" placeholder="Логин">
        <input type="password" id="l-pass" placeholder="Пароль">
        <button class="btn" onclick="auth('login')">ВОЙТИ</button>
        <button class="btn btn-alt" onclick="toggleForm('reg')">Нет аккаунта? Регистрация</button>
    </div>

    <!-- ФОРМА РЕГИСТРАЦИИ -->
    <div id="reg-form" class="hidden">
        <h2 class="neon">Registration</h2>
        <input type="text" id="r-user" placeholder="Придумайте логин">
        <input type="password" id="r-pass" placeholder="Придумайте пароль">
        <input type="text" id="r-inv" placeholder="Инвайт-код">
        <button class="btn" onclick="auth('reg')">СОЗДАТЬ АККАУНТ</button>
        <button class="btn btn-alt" onclick="toggleForm('login')">Уже есть аккаунт? Войти</button>
    </div>

    <!-- ЛИЧНЫЙ КАБИНЕТ -->
    <div id="dash" class="hidden">
        <h2 class="neon" id="u-name">ID: USER</h2>
        <div class="stat"><span>Статус:</span> <span style="color: #4CAF50;">ACTIVE</span></div>
        <div class="stat"><span>Инвайт от:</span> <span id="u-from">SYSTEM</span></div>
        
        <div style="margin-top:20px">
            <span style="font-size: 10px; color: #555;">ВАШИ ИНВАЙТЫ</span>
            <div class="inv-box" id="inv-list">Кодов пока нет</div>
            <button class="btn" onclick="genInvite()">СГЕНЕРИРОВАТЬ ИНВАЙТ</button>
        </div>

        <!-- АДМИН-ПАНЕЛЬ ДЛЯ RYODEU -->
        <div id="admin" class="hidden" style="margin-top:20px; border-top: 1px solid var(--neon); padding-top:15px;">
            <span style="font-size: 10px; color: var(--neon);">ADMIN SETTINGS</span>
            <input type="text" id="new-nick" placeholder="Новый ник">
            <button class="btn-alt" style="width:100%" onclick="changeNick()">Сменить ник в базе</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
        authDomain: "desolationcheat.firebaseapp.com",
        databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",
        projectId: "desolationcheat",
        storageBucket: "desolationcheat.firebasestorage.app",
        messagingSenderId: "437522470275",
        appId: "1:437522470275:web:5b20d57e9907100ec712b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Переключение форм
    window.toggleForm = (type) => {
        document.getElementById('login-form').classList.toggle('hidden', type === 'reg');
        document.getElementById('reg-form').classList.toggle('hidden', type === 'login');
    };

    // Общая функция входа и регистрации
    window.auth = async (type) => {
        const user = document.getElementById(type === 'login' ? 'l-user' : 'r-user').value.toLowerCase();
        const pass = document.getElementById(type === 'login' ? 'l-pass' : 'r-pass').value;
        const inv = type === 'reg' ? document.getElementById('r-inv').value : null;

        if(!user || !pass) return alert("Заполни все поля!");

        const userRef = ref(db, 'users/' + user);
        const snap = await get(userRef);

        if(type === 'login') {
            if(snap.exists() && snap.val().password === pass) {
                showDash(snap.val());
            } else {
                alert("Неверный логин или пароль!");
            }
        } else {
            if(snap.exists()) return alert("Логин занят!");
            if(!inv) return alert("Нужен инвайт!");
            
            const newUser = {
                username: user,
                password: pass,
                invitedBy: "INV-SYSTEM",
                role: (user === "ryodeu" ? "admin" : "user")
            };
            await set(userRef, newUser);
            showDash(newUser);
        }
    };

    function showDash(data) {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('reg-form').classList.add('hidden');
        document.getElementById('dash').classList.remove('hidden');
        document.getElementById('u-name').innerText = "ID: " + data.username.toUpperCase();
        document.getElementById('u-from').innerText = data.invitedBy;

        if(data.role === "admin" || data.username === "ryodeu") {
            document.getElementById('admin').classList.remove('hidden');
        }
    }

    window.genInvite = () => {
        const code = "DS-" + Math.random().toString(36).substring(2, 9).toUpperCase();
        document.getElementById('inv-list').innerText = code;
    };
</script>
</body>
</html>
