<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Bankroll Project</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --neon-pink: #ffadd2; /* Пастельно-розовый из твоих предпочтений */
            --dark-bg: #0d0d0d;
            --card-bg: #1a1a1a;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 800px;
            background: var(--card-bg);
            border: 1px solid #333;
            padding: 40px;
            box-shadow: 0 0 20px rgba(255, 173, 210, 0.1);
            position: relative;
        }

        /* Неоновый текст */
        .neon-text {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink), 0 0 10px var(--neon-pink);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .lang-switch {
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-item {
            text-align: left;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 18px;
            font-family: monospace;
        }

        .invites-box {
            background: #000;
            padding: 20px;
            border: 1px solid #222;
            font-family: monospace;
            font-size: 12px;
            color: var(--neon-pink);
            margin-bottom: 20px;
            min-height: 50px;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid #333;
            color: white;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            border-color: var(--neon-pink);
            box-shadow: inset 0 0 10px rgba(255, 173, 210, 0.2);
        }

        .flags img {
            width: 20px;
            cursor: pointer;
            margin-left: 10px;
            opacity: 0.6;
        }

        .flags img:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="lang-switch flags">
        <img src="https://flagcdn.com/ru.svg" onclick="setLang('ru')" alt="RU">
        <img src="https://flagcdn.com/us.svg" onclick="setLang('en')" alt="EN">
    </div>

    <div class="container">

        </div>

        <div class="stats-grid">

                <span class="stat-value neon-text" id="sub-status">ACTIVE</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Кем приглашен</span>
                <span class="stat-value" id="invited-by">SYSTEM</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Дата регистрации</span>
                <span class="stat-value" id="reg-date">01.05.2026</span>
            </div>

        <span class="stat-label">Ваши инвайт коды</span>
        <div class="invites-box" id="invites-list">
            DS-L-FSS0J9G6KA-T3MV | DS-L-7TKIT754CH-KOEA | DS-L-UPY1HOHVBE-XB1Z
        </div>

        <button class="btn" onclick="generateInvite()">Создать новый инвайт</button>
        
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <a href="https://funpay.com/lots/offer?id=67547531" target="_blank" class="btn" style="text-decoration: none; text-align: center; font-size: 12px;">Купить неделю</a>
            <a href="https://funpay.com/lots/offer?id=67547515" target="_blank" class="btn" style="text-decoration: none; text-align: center; font-size: 12px;">Купить месяц</a>
        </div>
    </div>

    <!-- Firebase Integration -->
    <script type="module">

        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
            authDomain: "desolationcheat.firebaseapp.com",
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",
            projectId: "desolationcheat",
            storageBucket: "desolationcheat.firebasestorage.app",
            messagingSenderId: "437522470275",
            appId: "1:437522470275:web:5b20d57e9907100ec712b6"

    </script>
</body>
</html>
