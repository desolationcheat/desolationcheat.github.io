<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DESOLATION</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        :root { 
            --accent: #ffb6c1; /* Pastel Pink */
            --bg: #050505; 
            --card: #0a0a0a;
            --brd: #1a1a1a; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; cursor: crosshair; }
        body { background: var(--bg); color: #fff; font-family: 'Arial', sans-serif; overflow-x: hidden; }

        /* Аккуратный редкий глитч раз в 5 секунд */
        @keyframes subtle-glitch {
            0%, 94%, 100% { transform: none; text-shadow: none; }
            95% { transform: translate(-1px, 1px); text-shadow: 1px 0 var(--accent); }
            97% { transform: translate(1px, -1px); text-shadow: -1px 0 #fff; }
        }
        .glitch { animation: subtle-glitch 5s infinite; }

        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--brd); background: var(--bg); z-index: 100;
        }

        .logo { font-family: 'Orbitron'; font-weight: 900; letter-spacing: 4px; font-size: 1.1rem; }
        .nav-link { color: #555; text-decoration: none; font-size: 0.7rem; letter-spacing: 2px; margin-left: 20px; transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: var(--accent); }

        /* Auth */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box { background: var(--card); border: 1px solid var(--brd); padding: 40px; width: 350px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid var(--brd); padding: 12px; color: #fff; margin-bottom: 10px; font-family: monospace; }
        input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 12px; background: var(--accent); color: #000; border: none; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; font-size: 0.7rem; }

        /* Main Content */
        main { display: none; opacity: 0; transition: 0.5s; padding: 120px 20px; flex-direction: column; align-items: center; }
        
        .profile-card {
            background: var(--card); border: 1px solid var(--brd); padding: 30px; 
            width: 100%; max-width: 600px; display: none; margin-top: 20px;
        }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-item { background: #000; padding: 15px; border: 1px solid #111; }
        .label { font-size: 0.6rem; color: #444; text-transform: uppercase; letter-spacing: 1px; }
        .val { font-family: 'Orbitron'; font-size: 0.8rem; margin-top: 5px; }

        .inv-list { margin-top: 15px; background: #000; padding: 10px; font-family: monospace; font-size: 0.7rem; color: var(--accent); border: 1px solid #111; max-height: 100px; overflow-y: auto; }
        
        .rename-btn { background: none; border: 1px solid #333; color: #333; font-size: 0.5rem; padding: 2px 5px; cursor: pointer; margin-left: 10px; }
        .rename-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>

    <nav>
        <div class="logo glitch">DESOLATION</div>
        <div>
            <span class="nav-link" onclick="toggleTab('main')">MAIN</span>
            <span class="nav-link" onclick="toggleTab('prof')">PROFILE</span>
        </div>
    </nav>

    <section id="auth-screen">
        <div class="auth-box" id="l-box">
            <h3 style="margin-bottom:20px; font-family:'Orbitron';">LOGIN</h3>
            <input type="text" id="l-u" placeholder="USERNAME">
            <input type="password" id="l-p" placeholder="PASSWORD">
            <button class="btn" onclick="login()">LOGIN</button>
            <p style="font-size:0.5rem; color:#333; margin-top:15px; cursor:pointer;" onclick="swap()">REGISTER</p>
        </div>
        <div class="auth-box" id="r-box" style="display:none;">
            <h3 style="margin-bottom:20px; font-family:'Orbitron';">REGISTER</h3>
            <input type="text" id="r-u" placeholder="USERNAME">
            <input type="password" id="r-p" placeholder="PASSWORD">
            <input type="text" id="r-i" placeholder="INVITE CODE">
            <button class="btn" onclick="reg()">CREATE</button>
            <p style="font-size:0.5rem; color:#333; margin-top:15px; cursor:pointer;" onclick="swap()">BACK</p>
        </div>
    </section>

    <main id="content">
        <div id="main-view" style="text-align:center;">
            <h1 class="glitch" style="font-family:'Orbitron'; font-size:3rem; letter-spacing:10px;">DESOLATION</h1>
            <p style="color:#444; letter-spacing:5px; font-size:0.7rem;">ARCHIVE BASED MODIFICATION</p>
        </div>

        <div id="prof-view" class="profile-card">
            <div style="display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #1a1a1a; padding-bottom:10px;">
                <h2 style="font-family:'Orbitron'; font-size:0.9rem;">IDENTITY: <span id="disp-u">---</span> <button id="edit-n" class="rename-btn" style="display:none;" onclick="rename()">RENAME</button></h2>
                <span id="p-status" style="font-size:0.6rem; color:var(--accent);">AUTHORIZED</span>
            </div>
            <div class="stat-grid">
                <div class="stat-item"><div class="label">Sub Status</div><div class="val" id="p-sub">Active</div></div>
                <div class="stat-item"><div class="label">Invited By</div><div class="val" id="p-by">System</div></div>
                <div class="stat-item"><div class="label">Monthly Limit</div><div class="val" id="p-lim">0 / 2</div></div>
                <div class="stat-item"><div class="label">Member Since</div><div class="val" id="p-date">--.--.--</div></div>
            </div>
            <div style="margin-top:20px;">
                <div class="label">Invite History</div>
                <div id="p-invs" class="inv-list">EMPTY</div>
                <button class="btn" style="margin-top:10px; background:#111; color:#fff; border:1px solid #222;" onclick="genInv()">GENERATE RANDOM KEY</button>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
            authDomain: "desolationcheat.firebaseapp.com",
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",
            projectId: "desolationcheat",
            storageBucket: "desolationcheat.firebasestorage.app",
            messagingSenderId: "437522470275",
            appId: "1:437522470275:web:5b20d57e9907100ec712b6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let user = null; let uid = "";

        function swap() {
            document.getElementById('l-box').style.display = document.getElementById('l-box').style.display === 'none' ? 'block' : 'none';
            document.getElementById('r-box').style.display = document.getElementById('r-box').style.display === 'none' ? 'block' : 'none';
        }

        function toggleTab(t) {
            document.getElementById('main-view').style.display = t === 'main' ? 'block' : 'none';
            document.getElementById('prof-view').style.display = t === 'prof' ? 'block' : 'none';
        }

        async function reg() {
            const u = document.getElementById('r-u').value.trim(), p = document.getElementById('r-p').value.trim(), i = document.getElementById('r-i').value.trim();
            const iS = await db.ref('invites/'+i).get();
            if(iS.exists() && iS.val().active) {
                await db.ref('users/'+u).set({ password:p, by: iS.val().gen_by || "System", date: new Date().toLocaleDateString(), invs:[], sub:"30 Days" });
                await db.ref('invites/'+i).update({ active:false, used_by:u });
                alert("Identity Created"); swap();
            } else alert("Invalid Invite Key");
        }

        async function login() {
            const u = document.getElementById('l-u').value.trim(), p = document.getElementById('l-p').value.trim();
            const s = await db.ref('users/'+u).get();
            if(s.exists() && s.val().password === p) {
                uid = u; user = s.val(); render();
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('content').style.display = 'flex';
                setTimeout(()=>document.getElementById('content').style.opacity='1',10);
            } else alert("Access Denied");
        }

        function render() {
            document.getElementById('disp-u').innerText = uid.toUpperCase();
            document.getElementById('p-by').innerText = user.by || "System";
            document.getElementById('p-date').innerText = user.date || "--.--.--";
            
            const m = new Date().getMonth()+"-"+new Date().getFullYear();
            const c = user.history ? (user.history[m] || 0) : 0;
            
            if(uid.toLowerCase() === 'ryodeu') {
                document.getElementById('edit-n').style.display = 'inline';
                document.getElementById('p-lim').innerText = "∞ / ∞";
            } else {
                document.getElementById('p-lim').innerText = c + " / 2";
            }
            document.getElementById('p-invs').innerText = (user.invs || []).join(' | ') || "NO KEYS GENERATED";
        }

        async function genInv() {
            const m = new Date().getMonth()+"-"+new Date().getFullYear();
            let c = user.history ? (user.history[m] || 0) : 0;
            if(uid.toLowerCase() !== 'ryodeu' && c >= 2) return alert("Monthly Limit Reached");

            const code = "DS-L-" + Math.random().toString(36).substring(2,12).toUpperCase() + "-" + Math.random().toString(36).substring(2,6).toUpperCase();
            await db.ref('invites/'+code).set({ active:true, gen_by:uid });
            const nI = user.invs ? [...user.invs, code] : [code];
            const nH = user.history || {}; nH[m] = c + 1;
            await db.ref('users/'+uid).update({ invs:nI, history:nH });
            user.invs = nI; user.history = nH; render();
        }

        async function rename() {
            const n = prompt("New Nickname:"); if(!n || n === uid) return;
            const check = await db.ref('users/'+n).get();
            if(check.exists()) return alert("Name Taken");
            await db.ref('users/'+n).set(user);
            await db.ref('users/'+uid).remove();
            alert("Identity Migrated. Re-login required.");
            location.reload();
        }
    </script>
</body>
</html>
