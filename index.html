<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DESOLATION // PROJECT</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@300;500&display=swap');

        :root {
            --neon-pink: #ffb6c1;
            --dark-bg: #030303;
            --panel: #0a0a0a;
            --brd: #1a1a1a;
            --glow: 0 0 15px rgba(255, 182, 193, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; cursor: crosshair; }
        body { background: var(--dark-bg); color: #eee; font-family: 'JetBrains Mono', monospace; overflow: hidden; }

        /* Intro & Typewriter */
        #intro {
            position: fixed; inset: 0; background: #000; z-index: 3000;
            display: flex; justify-content: center; align-items: center;
            animation: fadeOut 1s ease 3s forwards;
        }
        .typewriter {
            font-family: 'Orbitron'; font-size: 4rem; color: var(--neon-pink);
            text-shadow: var(--glow); letter-spacing: 10px;
            overflow: hidden; border-right: .15em solid var(--neon-pink);
            white-space: nowrap; width: 0;
            animation: typing 1.5s steps(10, end) forwards, blink-caret .75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--neon-pink); } }
        @keyframes fadeOut { to { visibility: hidden; opacity: 0; } }

        /* Shop Buttons from image_e3ef02.png */
        .shop-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
        .buy-card {
            border: 1px solid var(--brd); background: transparent;
            padding: 25px; display: flex; align-items: center; justify-content: center;
            gap: 12px; text-decoration: none; color: #fff;
            font-family: 'Orbitron'; font-size: 0.75rem; transition: 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .buy-card:hover { border-color: #444; background: rgba(255,255,255,0.02); }
        .buy-card i { font-size: 0.9rem; }

        /* Profile UID Styling */
        .uid-badge {
            background: linear-gradient(90deg, rgba(255,182,193,0.1), transparent);
            border-left: 2px solid var(--neon-pink);
            padding: 5px 12px; display: inline-block; margin-top: 5px;
        }

        /* Standard UI */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(3,3,3,0.95); border-bottom: 1px solid var(--brd); z-index: 1000;
        }
        .neon-txt { color: var(--neon-pink); text-shadow: var(--glow); font-family: 'Orbitron'; }
        
        main { display: none; padding: 120px 20px 50px; flex-direction: column; align-items: center; height: 100vh; overflow-y: auto; }
        .content-box { width: 100%; max-width: 900px; animation: pageIn 0.5s ease-out; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .feature-item { margin-bottom: 15px; font-size: 0.8rem; color: #777; }
        .feature-item b { color: var(--neon-pink); margin-right: 5px; }

        .btn-gen {
            background: none; border: 1px solid var(--brd); color: #555;
            padding: 10px 20px; font-family: 'Orbitron'; font-size: 0.6rem;
            cursor: pointer; transition: 0.3s; margin-top: 15px;
        }
        .btn-gen:hover:not(:disabled) { border-color: var(--neon-pink); color: var(--neon-pink); }
        .btn-gen:disabled { opacity: 0.3; cursor: not-allowed; }

        #auth-page { position: fixed; inset: 0; background: var(--dark-bg); z-index: 2000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--panel); border: 1px solid var(--brd); padding: 40px; width: 350px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid var(--brd); padding: 12px; color: #fff; margin-bottom: 10px; font-family: inherit; font-size: 0.8rem; }
        .primary-btn { width: 100%; padding: 12px; background: var(--neon-pink); color: #000; border: none; font-family: 'Orbitron'; font-weight: 900; cursor: pointer; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="intro"><div class="typewriter">DESOLATION</div></div>

    <section id="auth-page">
        <div class="auth-card">
            <h2 class="neon-txt" style="margin-bottom: 25px; font-size: 1rem;">Terminal.exe</h2>
            <div id="box-l">
                <input type="text" id="l-u" placeholder="LOGIN">
                <input type="password" id="l-p" placeholder="PASSWORD">
                <button class="primary-btn" onclick="login()">ENTER</button>
                <p style="font-size: 0.5rem; color: #333; margin-top: 15px; cursor: pointer;" onclick="swap(true)">[ NO ACCESS? REGISTER ]</p>
            </div>
            <div id="box-r" class="hidden">
                <input type="text" id="r-u" placeholder="USERNAME">
                <input type="password" id="r-p" placeholder="PASSWORD">
                <input type="text" id="r-i" placeholder="INVITE CODE">
                <button class="primary-btn" onclick="register()">CREATE</button>
                <p style="font-size: 0.5rem; color: #333; margin-top: 15px; cursor: pointer;" onclick="swap(false)">[ BACK ]</p>
            </div>
        </div>
    </section>

    <nav>
        <div class="neon-txt" style="font-size: 1.2rem; cursor:pointer" onclick="tab('h')">DESOLATION</div>
        <div style="display: flex; gap: 25px; font-size: 0.7rem;">
            <div onclick="tab('h')" style="cursor:pointer"><i class="fa-solid fa-ghost"></i> MAIN</div>
            <div onclick="tab('p')" style="cursor:pointer"><i class="fa-solid fa-id-card"></i> PROFILE</div>
            <a href="https://t.me/desolation_samp" target="_blank" style="text-decoration:none; color:inherit"><i class="fa-brands fa-telegram"></i> TELEGRAM</a>
        </div>
    </nav>

    <main id="app">
        <div id="vh" class="content-box">
            <div style="border-left: 2px solid var(--neon-pink); padding-left: 20px; margin-bottom: 40px;">
                <h3 class="neon-txt" style="font-size: 0.9rem; margin-bottom: 10px;">SYSTEM STATUS: ONLINE</h3>
                <div id="type-desc" style="font-size: 0.75rem; color: #555; min-height: 50px; line-height: 1.6;"></div>
            </div>

            <div class="shop-container">
                <a href="#" class="buy-card"><i class="fa-solid fa-cart-shopping"></i> Buy 7 Days (150₽)</a>
                <a href="#" class="buy-card"><i class="fa-solid fa-crown"></i> Buy 30 Days (400₽)</a>
            </div>
        </div>

        <div id="vp" class="content-box hidden">
            <div style="background: var(--panel); border: 1px solid var(--brd); padding: 30px;">
                <h2 class="neon-txt" id="u-display" style="font-size: 1.5rem;">USER</h2>
                <div class="uid-badge">
                    <span style="font-size: 0.6rem; color: #888; text-transform: uppercase;">User ID:</span>
                    <span id="u-uid" style="font-size: 0.7rem; color: #fff; font-weight: bold; margin-left: 5px;">000</span>
                </div>

                <div style="margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <p style="font-size: 0.55rem; color: #333;">SUBSCRIPTION STATUS</p>
                        <p id="u-sub" style="font-size: 0.75rem; color: #0f0;">LIFETIME</p>
                    </div>
                    <div>
                        <p style="font-size: 0.55rem; color: #333;">RANK</p>
                        <p id="u-rank" style="font-size: 0.75rem; color: var(--neon-pink);">USER</p>
                    </div>
                </div>

                <div style="margin-top: 40px; border-top: 1px solid #111; pt: 20px;">
                    <p style="font-size: 0.6rem; color: #444; margin-bottom: 10px;">INVITE MANAGEMENT (LIMIT: 2/MONTH)</p>
                    <div id="u-invs" style="font-size: 0.65rem; color: #666; margin-bottom: 10px;"></div>
                    <button id="gen-btn" class="btn-gen" onclick="gen()">GENERATE CODE</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0", 
            authDomain: "desolationcheat.firebaseapp.com", 
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com", 
            projectId: "desolationcheat" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let user = null, uid = "";
        const descText = "Silent Aim, Wallshot, ESP (Bones/Boxes), Настраиваемый конфиг и самый красивый визуал на рынке SAMP. Подключайся к элите прямо сейчас.";

        function typeWriter(id, text, speed = 30) {
            let i = 0;
            const el = document.getElementById(id);
            el.innerHTML = "";
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        function swap(r) {
            document.getElementById('box-l').classList.toggle('hidden', r);
            document.getElementById('box-r').classList.toggle('hidden', !r);
        }

        async function login() {
            const u = document.getElementById('l-u').value.toLowerCase().trim();
            const p = document.getElementById('l-p').value.trim();
            const s = await db.ref('users/'+u).get();
            if(s.exists() && s.val().password === p) {
                uid = u; user = s.val(); 
                document.getElementById('auth-page').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                load();
                typeWriter('type-desc', descText);
            } else alert("ACCESS DENIED");
        }

        async function register() {
            const u = document.getElementById('r-u').value.toLowerCase().trim();
            const p = document.getElementById('r-p').value.trim(), i = document.getElementById('r-i').value.trim();
            const inv = await db.ref('invites/'+i).get();
            
            if(inv.exists() && inv.val().active) {
                const count = (await db.ref('stats/userCount').get()).val() || 0;
                await db.ref('users/'+u).set({ 
                    password: p, 
                    by: inv.val().gen_by, 
                    date: new Date().toLocaleDateString(), 
                    uid: count + 1, 
                    rank: "USER",
                    gen_count: 0,
                    last_gen_month: new Date().getMonth()
                });
                await db.ref('invites/'+i).update({ active: false });
                await db.ref('stats/userCount').set(count + 1);
                alert("SUCCESS"); swap(false);
            } else alert("INVALID INVITE");
        }

        function load() {
            document.getElementById('u-display').innerText = uid.toUpperCase();
            document.getElementById('u-uid').innerText = String(user.uid).padStart(3, '0');
            document.getElementById('u-rank').innerText = user.rank || "USER";
            document.getElementById('u-invs').innerText = (user.invs || []).join(' | ') || "NO CODES GENERATED";
            
            // Проверка лимитов для кнопки
            const currentMonth = new Date().getMonth();
            if (user.last_gen_month !== currentMonth) {
                db.ref('users/'+uid).update({ gen_count: 0, last_gen_month: currentMonth });
                user.gen_count = 0;
            }
            if (user.gen_count >= 2 && user.rank !== "None") {
                document.getElementById('gen-btn').disabled = true;
                document.getElementById('gen-btn').innerText = "LIMIT REACHED";
            }
        }

        async function gen() {
            if (user.gen_count >= 2 && user.rank !== "None") return;
            
            const code = "DSL-" + Math.random().toString(36).substring(2,8).toUpperCase();
            await db.ref('invites/'+code).set({ active: true, gen_by: uid });
            
            let my = user.invs || [];
            my.push(code);
            const newCount = (user.gen_count || 0) + 1;
            
            await db.ref('users/'+uid).update({ invs: my, gen_count: newCount });
            user.invs = my; user.gen_count = newCount;
            load();
        }

        function tab(t) {
            document.getElementById('vh').classList.toggle('hidden', t!=='h');
            document.getElementById('vp').classList.toggle('hidden', t!=='p');
            if(t === 'h') typeWriter('type-desc', descText);
        }
    </script>
</body>
</html>
