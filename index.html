<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESOLATION | PRIVATE ARCHIVE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Syne:wght@400;800&display=swap');

        :root { 
            --accent: #ff0055; 
            --bg: #030303; 
            --card-bg: #080808;
            --border: #151515; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; cursor: crosshair; }
        body { background: var(--bg); color: #fff; font-family: 'Syne', sans-serif; overflow-x: hidden; }

        /* АККУРАТНЫЙ ПЕРИОДИЧЕСКИЙ ГЛИТЧ */
        @keyframes subtle-glitch {
            0%, 90%, 100% { transform: translate(0); opacity: 1; }
            92% { transform: translate(-2px, 1px); opacity: 0.8; text-shadow: 2px 0 var(--accent); }
            94% { transform: translate(2px, -1px); opacity: 1; text-shadow: -2px 0 #00fffb; }
            96% { transform: translate(-1px, 0); }
        }
        .glitch-text { animation: subtle-glitch 5s infinite; }

        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(3,3,3,0.95); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 5px; font-size: 1.2rem; }
        .nav-btns { display: flex; gap: 15px; }

        #auth-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: 1.2s cubic-bezier(0.85, 0, 0.15, 1);
        }
        .auth-card { background: var(--card-bg); border: 1px solid var(--border); padding: 40px; width: 380px; text-align: center; }
        input { width: 100%; background: #000; border: 1px solid var(--border); padding: 12px; color: #fff; margin-bottom: 12px; font-family: monospace; font-size: 0.8rem; }
        input:focus { border-color: var(--accent); }
        
        .main-btn { width: 100%; padding: 12px; background: var(--accent); border: none; color: #000; font-weight: 900; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 0.7rem; letter-spacing: 1px; }
        .main-btn:hover { box-shadow: 0 0 20px var(--accent); transform: translateY(-2px); }

        main { display: none; opacity: 0; flex-direction: column; align-items: center; padding: 120px 20px; transition: 0.8s; }
        
        /* СЕКЦИЯ ПРОФИЛЯ */
        #profile-section { display: none; width: 100%; max-width: 700px; background: var(--card-bg); border: 1px solid var(--border); padding: 30px; margin-top: 20px; position: relative; }
        .profile-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .info-item { background: #000; padding: 15px; border: 1px solid #111; }
        .label { font-size: 0.6rem; color: #444; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .value { font-family: 'Orbitron'; font-size: 0.9rem; color: #fff; }

        .invite-list { margin-top: 20px; max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.75rem; color: var(--accent); background: #000; padding: 10px; border: 1px solid #111; }
        
        /* Кнопка смены ника для ryodeu */
        #rename-btn { background: none; border: 1px solid #333; color: #555; padding: 2px 8px; font-size: 0.6rem; margin-left: 10px; cursor: pointer; }
        #rename-btn:hover { border-color: var(--accent); color: var(--accent); }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo glitch-text">0000X1 // DESOLATION</div>
        <div class="nav-btns">
            <button class="tg-link" style="background:none; border:1px solid #222; color:#fff; cursor:pointer; padding:5px 15px;" onclick="showTab('main')">MAIN</button>
            <button class="tg-link" style="background:none; border:1px solid #222; color:#fff; cursor:pointer; padding:5px 15px;" onclick="showTab('profile')">PROFILE</button>
        </div>
    </nav>

    <section id="auth-screen">
        <div class="auth-card" id="login-box">
            <h2 class="glitch-text" style="margin-bottom:25px; letter-spacing:5px;">ACCESS</h2>
            <input type="text" id="l-user" placeholder="LOGIN">
            <input type="password" id="l-pass" placeholder="PASSWORD">
            <button class="main-btn" onclick="login()">Enter System</button>
            <p style="margin-top:20px; font-size:0.6rem; color:#333; cursor:pointer" onclick="toggleAuth()">NO_ACCOUNT? REGISTER</p>
        </div>

        <div class="auth-card" id="reg-box" style="display:none">
            <h2 class="glitch-text" style="margin-bottom:25px; letter-spacing:5px;">INITIALIZE</h2>
            <input type="text" id="r-user" placeholder="NEW_LOGIN">
            <input type="password" id="r-pass" placeholder="NEW_PASSWORD">
            <input type="text" id="r-inv" placeholder="INVITE_CODE">
            <button class="main-btn" onclick="register()">Create Identity</button>
            <p style="margin-top:20px; font-size:0.6rem; color:#333; cursor:pointer" onclick="toggleAuth()">BACK_TO_LOGIN</p>
        </div>
    </section>

    <main id="main-content">
        <div id="profile-section">
            <div class="profile-header">
                <div>
                    <span class="label">Identity</span><br>
                    <span class="value" id="p-username">---</span>
                    <button id="rename-btn" style="display:none" onclick="changeNickname()">RENAME</button>
                </div>
                <div style="text-align:right">
                    <span class="label">Status</span><br>
                    <span class="value" style="color:var(--accent)">PREMIUM_USER</span>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="label">Subscription_Expires</div>
                    <div class="value" id="p-sub">PERMANENT</div>
                </div>
                <div class="info-item">
                    <div class="label">Invited_By</div>
                    <div class="value" id="p-invited-by">SYSTEM</div>
                </div>
                <div class="info-item">
                    <div class="label">Monthly_Limit</div>
                    <div class="value" id="p-limit">0 / 2</div>
                </div>
                <div class="info-item">
                    <div class="label">Member_Since</div>
                    <div class="value" id="p-joined">01.01.2026</div>
                </div>
            </div>

            <div style="margin-top:25px;">
                <div class="label">Your_Invite_Pool</div>
                <div id="user-invites" class="invite-list">EMPTY</div>
                <button id="gen-btn" class="main-btn" style="margin-top:15px; background:#111; color:#fff; border:1px solid var(--border);" onclick="generateUserInvite()">GENERATE_NEW_IDENTITY_KEY</button>
            </div>
        </div>

        <div id="main-tab" style="text-align:center; margin-top:50px;">
            <h1 style="font-size:4rem; letter-spacing:20px; font-family:'Orbitron';" class="glitch-text">BANKROLL</h1>
            <p style="color:var(--accent); letter-spacing:8px; font-size:0.8rem;">MAFIA_EDITION // BY RYODEU</p>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
            authDomain: "desolationcheat.firebaseapp.com",
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",
            projectId: "desolationcheat",
            storageBucket: "desolationcheat.firebasestorage.app",
            messagingSenderId: "437522470275",
            appId: "1:437522470275:web:5b20d57e9907100ec712b6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let currentUser = null;
        let currentUID = "";

        function toggleAuth() {
            document.getElementById('login-box').style.display = document.getElementById('login-box').style.display === 'none' ? 'block' : 'none';
            document.getElementById('reg-box').style.display = document.getElementById('reg-box').style.display === 'none' ? 'block' : 'none';
        }

        function showTab(tab) {
            document.getElementById('main-tab').style.display = tab === 'main' ? 'block' : 'none';
            document.getElementById('profile-section').style.display = tab === 'profile' ? 'block' : 'none';
        }

        async function register() {
            const u = document.getElementById('r-user').value.trim();
            const p = document.getElementById('r-pass').value.trim();
            const i = document.getElementById('r-inv').value.trim();
            
            const invSnap = await db.ref('invites/' + i).get();
            const userSnap = await db.ref('users/' + u).get();

            if(userSnap.exists()) return alert("ERROR: NAME_TAKEN");
            if(invSnap.exists() && invSnap.val().active === true) {
                const creator = invSnap.val().generated_by || "SYSTEM";
                await db.ref('users/' + u).set({
                    password: p,
                    invited_by: creator,
                    joined: new Date().toLocaleDateString(),
                    my_invites: [],
                    sub_end: "30_DAYS"
                });
                await db.ref('invites/' + i).update({ active: false, used_by: u });
                alert("SUCCESS: ACCOUNT_READY");
                toggleAuth();
            } else {
                alert("ERROR: INVALID_INVITE");
            }
        }

        async function login() {
            const u = document.getElementById('l-user').value.trim();
            const p = document.getElementById('l-pass').value.trim();
            const snap = await db.ref('users/' + u).get();

            if(snap.exists() && snap.val().password === p) {
                currentUID = u;
                currentUser = snap.val();
                loadProfile();
                document.getElementById('auth-screen').style.transform = 'translateY(-100%)';
                document.getElementById('main-content').style.display = 'flex';
                setTimeout(() => document.getElementById('main-content').style.opacity = '1', 100);
            } else {
                alert("ERROR: WRONG_CREDENTIALS");
            }
        }

        function loadProfile() {
            document.getElementById('p-username').innerText = currentUID.toUpperCase();
            document.getElementById('p-invited-by').innerText = currentUser.invited_by || "SYSTEM";
            document.getElementById('p-joined').innerText = currentUser.joined || "UNKNOWN";
            document.getElementById('p-sub').innerText = currentUser.sub_end || "30_DAYS";
            
            // Если ты - создатель
            if(currentUID.toLowerCase() === 'ryodeu') {
                document.getElementById('rename-btn').style.display = 'inline-block';
                document.getElementById('p-limit').innerText = "∞ / ∞";
            } else {
                const mKey = new Date().getMonth() + "-" + new Date().getFullYear();
                const count = currentUser.gen_history ? (currentUser.gen_history[mKey] || 0) : 0;
                document.getElementById('p-limit').innerText = `${count} / 2`;
            }

            const invs = currentUser.my_invites || [];
            document.getElementById('user-invites').innerHTML = invs.length ? invs.join('<br>') : "NO_GENERATED_KEYS";
        }

        async function generateUserInvite() {
            const mKey = new Date().getMonth() + "-" + new Date().getFullYear();
            let count = currentUser.gen_history ? (currentUser.gen_history[mKey] || 0) : 0;

            if(currentUID.toLowerCase() !== 'ryodeu' && count >= 2) return alert("LIMIT_EXCEEDED");

            const newCode = "BKR-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();
            
            await db.ref('invites/' + newCode).set({
                active: true,
                generated_by: currentUID
            });

            const updatedInvs = currentUser.my_invites ? [...currentUser.my_invites, newCode] : [newCode];
            const updatedHistory = currentUser.gen_history || {};
            updatedHistory[mKey] = count + 1;

            await db.ref('users/' + currentUID).update({
                my_invites: updatedInvites,
                gen_history: updatedHistory
            });

            currentUser.my_invites = updatedInvs;
            currentUser.gen_history = updatedHistory;
            loadProfile();
        }

        async function changeNickname() {
            const newNick = prompt("ENTER_NEW_NICKNAME:").trim();
            if(!newNick || newNick === currentUID) return;
            
            const check = await db.ref('users/' + newNick).get();
            if(check.exists()) return alert("NAME_TAKEN");

            await db.ref('users/' + newNick).set(currentUser);
            await db.ref('users/' + currentUID).remove();
            
            alert("IDENTITY_UPDATED. PLEASE_RE-LOGIN.");
            location.reload();
        }
    </script>
</body>
</html>
