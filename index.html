<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Desolation Project</title>
    <style>
        /* Розовый неон и пастельные тона */
        :root {
            --neon-pink: #ffadd2; 
            --dark-bg: #080808;
            --panel-bg: #121212;
        }

        body {
            background-color: var(--dark-bg);
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .main-panel {
            width: 800px;
            background: var(--panel-bg);
            border: 1px solid #222;
            padding: 35px;
            box-shadow: 0 0 20px rgba(255, 173, 210, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: border-box;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .user-id {
            color: var(--neon-pink);
            font-size: 26px;
            font-weight: bold;
            text-shadow: 0 0 8px var(--neon-pink);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .label { font-size: 10px; color: #555; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .value { font-size: 16px; font-family: monospace; }

        .invites-area {
            background: #000;
            padding: 15px;
            border: 1px solid #1a1a1a;
            color: var(--neon-pink);
            font-family: monospace;
            min-height: 30px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: none;
            border: 1px solid #333;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover { border-color: var(--neon-pink); color: var(--neon-pink); }

        .flags { float: right; margin-bottom: 10px; }
        .flags img { width: 20px; cursor: pointer; margin-left: 8px; opacity: 0.6; }
        .flags img:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="main-panel">
    <div class="flags">
        <img src="https://flagcdn.com/ru.svg" onclick="setLang('ru')">
        <img src="https://flagcdn.com/us.svg" onclick="setLang('en')">
    </div>

    <div class="header">
        <div class="user-id" id="nick">ID: RYODEU</div>
        <div style="font-size: 10px; color: #444;">AUTHORIZED</div>
    </div>

    <div class="grid">
        <div><span class="label" id="l-sub">Статус подписки</span><span class="value" id="sub-days">ACTIVE (30d)</span></div>
        <div><span class="label" id="l-inv">Кем приглашен</span><span class="value">SYSTEM</span></div>
        <div><span class="label" id="l-reg">Дата регистрации</span><span class="value">01.05.2026</span></div>
    </div>

    <span class="label" id="l-codes">Ваши инвайт коды</span>
    <div class="invites-area" id="codes-list">DS-L-FSS0J9G6KA-T3MV</div>

    <button class="btn" onclick="genInvite()" id="b-gen">Создать новый инвайт</button>
    
    <div style="display: flex; gap: 10px; margin-top: 10px;">
        <a href="https://funpay.com/lots/offer?id=67547531" style="flex:1"><button class="btn">Week</button></a>
        <a href="https://funpay.com/lots/offer?id=67547515" style="flex:1"><button class="btn">Month</button></a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
        authDomain: "desolationcheat.firebaseapp.com",
        databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",
        projectId: "desolationcheat",
        storageBucket: "desolationcheat.firebasestorage.app",
        messagingSenderId: "437522470275",
        appId: "1:437522470275:web:5b20d57e9907100ec712b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Твой ник для проверки прав
    const myNick = "ryodeu"; 

    window.genInvite = () => {
        const code = "DS-" + Math.random().toString(36).substring(2, 11).toUpperCase();
        if(myNick === "ryodeu") {
            document.getElementById('codes-list').innerText += " | " + code;
        } else {
            alert("Лимит 2 инвайта!");
        }
    };

    window.setLang = (lang) => {
        const t = {
            ru: { sub: "Статус подписки", inv: "Кем приглашен", reg: "Дата регистрации", codes: "Ваши коды", gen: "Создать новый инвайт" },
            en: { sub: "Subscription", inv: "Invited by", reg: "Reg Date", codes: "Your codes", gen: "Generate Invite" }
        };
        document.getElementById('l-sub').innerText = t[lang].sub;
        document.getElementById('l-inv').innerText = t[lang].inv;
        document.getElementById('l-reg').innerText = t[lang].reg;
        document.getElementById('l-codes').innerText = t[lang].codes;
        document.getElementById('b-gen').innerText = t[lang].gen;
    };
</script>
</body>
</html>
