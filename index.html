<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desolation | Official</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.8; text-shadow: 0 0 15px #ff0000; }
            to { opacity: 1; text-shadow: 0 0 35px #ff0000; }
        }

        .tagline {
            color: #444;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            text-decoration: none;
            color: #fff;
            border: 1px solid #222;
            padding: 12px 40px;
            width: 200px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 2px;
            background: transparent;
            cursor: pointer;
        }

        .btn:hover {
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .btn.primary {
            background: #ff0000;
            border: none;
            color: #000;
            font-weight: bold;
        }

        /* Модальное окно логина */
        #loginModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: #0a0a0a;
            border: 1px solid #ff0000;
            padding: 40px;
            text-align: center;
        }

        .modal-box input {
            background: #000;
            border: 1px solid #333;
            color: #ff0000;
            padding: 10px;
            margin: 20px 0;
            width: 100%;
            outline: none;
        }

        .close {
            color: #444;
            cursor: pointer;
            float: right;
            margin-top: -30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Desolation</h1>
        <p class="tagline">Premium Performance Software</p>
        
        <div class="links">
            <button class="btn" onclick="document.getElementById('loginModal').style.display='flex'">Client Login</button>
            <a href="https://funpay.com/lots/offer?id=67547531" class="btn" target="_blank">Buy Week</a>
            <a href="https://funpay.com/lots/offer?id=67547515" class="btn" target="_blank">Buy Month</a>
            <a href="https://t.me/desolationcheat" class="btn primary" target="_blank">Telegram</a>
        </div>
    </div>

    <div id="loginModal">
        <div class="modal-box">
            <span class="close" onclick="document.getElementById('loginModal').style.display='none'">&times;</span>
            <h2 style="letter-spacing: 2px;">AUTHORIZATION</h2>
            <input type="text" placeholder="LICENSE KEY">
            <button class="btn" onclick="alert('Invalid Key')">Connect</button>
        </div>
    </div>

</body>
</html>
