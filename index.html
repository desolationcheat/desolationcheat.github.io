<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desolation | Private</title>
    <style>
        :root {
            --accent: #ff0000;
            --bg: #050505;
            --card-bg: #0a0a0a;
            --border: #1a1a1a;
            --text-dim: #444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Nav */
        nav {
            width: 100%;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            position: fixed;
            top: 0;
            z-index: 10;
        }
        .logo { font-weight: 900; letter-spacing: 5px; text-transform: uppercase; font-size: 1.2rem; }
        .logo span { color: var(--accent); }
        
        .client-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Hero */
        .hero {
            margin-top: 20vh;
            text-align: center;
            margin-bottom: 60px;
        }
        .hero h1 { font-size: 5rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; }
        .hero p { color: var(--text-dim); letter-spacing: 4px; font-size: 0.8rem; }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2px;
            background: var(--border);
            width: 100%;
            max-width: 900px;
            border: 1px solid var(--border);
        }
        .card {
            background: var(--card-bg);
            padding: 60px 40px;
            text-align: center;
            transition: 0.3s;
        }
        .card:hover { background: #0c0c0c; }
        .card h3 { color: var(--text-dim); font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 20px; }
        .card .val { font-size: 3.5rem; font-weight: 900; margin-bottom: 40px; }
        
        .buy-btn {
            display: block;
            text-decoration: none;
            color: #fff;
            border: 1px solid var(--border);
            padding: 15px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
        }
        .buy-btn:hover { background: #fff; color: #000; border-color: #fff; }

        /* TG */
        .tg-link {
            margin: 60px 0;
            text-decoration: none;
            color: var(--accent);
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid var(--accent);
            padding: 15px 40px;
            transition: 0.3s;
        }
        .tg-link:hover { background: var(--accent); color: #fff; box-shadow: 0 0 30px rgba(255,0,0,0.3); }

        /* Auth Modal */
        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .modal-content h2 { font-size: 1.5rem; letter-spacing: 5px; margin-bottom: 30px; }
        .modal-content input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 15px;
            color: #fff;
            margin-bottom: 15px;
            font-family: inherit;
            text-align: center;
        }
        .modal-content input:focus { border-color: var(--accent); }
        .close-btn { color: var(--text-dim); cursor: pointer; font-size: 0.7rem; margin-top: 20px; text-decoration: underline; text-transform: uppercase; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">DESO<span>LATION</span></div>
        <button class="client-btn" onclick="openModal()">Client Login</button>
    </nav>

    <div class="hero">
        <h1>Desolation</h1>
        <p>REDEFINING THE STANDARDS</p>
    </div>

    <div class="grid">
        <div class="card">
            <h3>RECURRING</h3>
            <div class="val">7 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547531" class="buy-btn" target="_blank">PURCHASE</a>
        </div>
        <div class="card">
            <h3>RECURRING</h3>
            <div class="val">30 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547515" class="buy-btn" target="_blank">PURCHASE</a>
        </div>
    </div>

    <a href="https://t.me/desolationcheat" class="tg-link" target="_blank">Join Telegram</a>

    <div id="modal">
        <div class="modal-content">
            <h2>INVITE ONLY</h2>
            <input type="text" id="username" placeholder="USERNAME">
            <input type="text" id="invite" placeholder="INVITE KEY">
            <button class="client-btn" style="width: 100%;" onclick="checkInvite()">Register</button>
            <div class="close-btn" onclick="closeModal()">CLOSE</div>
        </div>
    </div>

    <script>
        const validInvites = ['DSLT-K92B-X10P', 'DSLT-M48R-ZQLW', 'DSLT-77VX-991A', 'DSLT-B002-HHX4', 'DSLT-PL81-KJS6'];
        
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function checkInvite() {
            const inviteInput = document.getElementById('invite').value.trim().toUpperCase();
            
            if(validInvites.includes(inviteInput)) {
                alert('Success! Welcome to Desolation.');
                closeModal();
            } else {
                alert('Invalid Invite Key.');
            }
        }
    </script>
</body>
</html>
