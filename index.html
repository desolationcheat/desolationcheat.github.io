<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESOLATION | Software</title>
    <style>
        /* Весь стиль здесь, чтобы точно работало */
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            margin: 0;
            letter-spacing: 15px;
            text-transform: uppercase;
            color: #ffffff;
            /* Тот самый красный неоновый свет */
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.8; text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
            to { opacity: 1; text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; }
        }

        p {
            color: #555;
            letter-spacing: 5px;
            margin-top: 15px;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .links {
            margin-top: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            text-decoration: none;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 30px;
            border-radius: 2px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
        }

        .links a:hover {
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            background: rgba(255, 0, 0, 0.05);
        }

        /* Анимированный фон со звездами/точками */
        .bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #111 0%, #050505 100%);
            z-index: -1;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#ffffff 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.05;
        }
    </style>
</head>
<body>

</html>
