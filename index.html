<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Bankroll Project | Dashboard</title>
    <style>
        /* Розовый неон и темная тема */
        :root {
            --neon-pink: #ffadd2; 
            --dark-bg: #0a0a0a;
            --panel-bg: #141414;
        }

        body {
            background-color: var(--dark-bg);
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .dashboard {
            width: 900px;
            background: var(--panel-bg);
            border: 1px solid #222;
            padding: 30px;
            position: relative;
        }

        /* Элементы из скриншота image_e71a97.png */
        .user-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .user-id {
            font-size: 24px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            font-weight: bold;
        }

        .stats-container {
            display: flex;
            gap: 50px;
            margin-bottom: 30px;
        }

        .stat-block {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .value {
            font-size: 16px;
            font-family: monospace;
        }

        /* Инвайты */
        .invite-section {
            background: #000;
            border: 1px solid #1a1a1a;
            padding: 15px;
            margin: 20px 0;
            color: var(--neon-pink);
            font-size: 13px;
            min-height: 40px;
        }

        .btn {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 25px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

        .btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }

        /* Смена ника (только для ryodeu) */
        #rename-section {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="user-header">
        <div class="user-id" id="display-name">ID: LOADING...</div>
        <div style="font-size: 11px; color: #444;">АВТОРИЗОВАН</div>
    </div>

    <div class="stats-container">
        <div class="stat-block">
            <span class="label">Статус подписки</span>
            <span class="value" id="sub-days" style="color: #0f0;">ACTIVE (0 дней)</span>
        </div>
        <div class="stat-block">
            <span class="label">Кем приглашен</span>
            <span class="value" id="inviter">SYSTEM</span>
        </div>
        <div class="stat-block">
            <span class="label">Дата регистрации</span>
            <span class="value" id="reg-date">00.00.0000</span>
        </div>
    </div>

    <div class="label">Ваши инвайт коды</div>
    <div class="invite-section" id="invites-pool">
        <!-- Коды будут тут -->
    </div>

    <button class="btn" id="gen-btn">СОЗДАТЬ НОВЫЙ ИНВАЙТ</button>

    <div id="rename-section">
        <input type="text" id="new-nick" placeholder="Новый ник" style="background: #000; border: 1px solid #333; color: white; padding: 5px;">
        <button onclick="changeNick()" style="color: pink; cursor: pointer;">Сменить ник</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

    // Твоя конфигурация Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
        authDomain: "desolationcheat.firebaseapp.com",
        databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",
        projectId: "desolationcheat",
        storageBucket: "desolationcheat.firebasestorage.app",
        messagingSenderId: "437522470275",
        appId: "1:437522470275:web:5b20d57e9907100ec712b6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Эмуляция текущего пользователя (для теста поставь 'ryodeu' или 'other')
    const currentUserID = "ryodeu"; 

    // Загрузка данных
    const userRef = ref(db, 'users/' + currentUserID);
    onValue(userRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            document.getElementById('display-name').innerText = "ID: " + data.username;
            document.getElementById('inviter').innerText = data.invitedBy;
            document.getElementById('reg-date').innerText = data.regDate;
            
            // Расчет дней подписки
            const today = new Date();
            const expDate = new Date(data.expiry);
            const diff = Math.ceil((expDate - today) / (1000 * 60 * 60 * 24));
            document.getElementById('sub-days').innerText = `ACTIVE (${diff > 0 ? diff : 0} дн.)`;

            // Логика прав доступа
            if (currentUserID === "ryodeu") {
                document.getElementById('rename-section').style.display = "block";
            }
        }
    });

    // Генерация инвайтов
    document.getElementById('gen-btn').onclick = function() {
        if (currentUserID === "ryodeu") {
            // Бесконечно для тебя
            const code = "BK-" + Math.random().toString(36).substr(2, 9).toUpperCase();
            document.getElementById('invites-pool').innerText += code + " | ";
        } else {
            // Здесь должна быть проверка счетчика в БД (макс 2)
            alert("Лимит 2 инвайта в месяц!");
        }
    };
</script>
</body>
</html>
