<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desolation | Performance</title>
    <style>
        :root {
            --accent: #ff0000;
            --bg: #0b0b0b;
            --panel: rgba(20, 20, 20, 0.8);
            --border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: #eee;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
        }

        /* Навигация в стиле Interium */
        nav {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-weight: 800;
            letter-spacing: 2px;
            font-size: 1.2rem;
            color: #fff;
        }

        .logo span { color: var(--accent); }

        .login-trigger {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        .login-trigger:hover { filter: brightness(1.2); }

        /* Главный блок */
        .hero {
            padding: 180px 20px 100px;
            text-align: center;
            background: radial-gradient(circle at center, #1a0505 0%, var(--bg) 70%);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .hero p {
            color: #888;
            letter-spacing: 4px;
            font-size: 0.9rem;
        }

        /* Карточки товаров */
        .pricing {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 40px 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            transition: 0.3s;
        }

        .card:hover {
            border-color: rgba(255, 0, 0, 0.3);
            transform: translateY(-5px);
        }

        .card h3 { font-size: 0.8rem; color: #666; letter-spacing: 2px; }
        .price { font-size: 2.5rem; font-weight: 800; margin: 15px 0; color: #fff; }

        .buy-btn {
            display: block;
            text-decoration: none;
            color: #fff;
            border: 1px solid var(--border);
            padding: 12px;
            margin-top: 25px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.3s;
            border-radius: 4px;
        }

        .buy-btn:hover {
            background: #fff;
            color: #000;
        }

        .tg-section { text-align: center; margin: 40px 0; }
        .tg-link { color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; }

        /* Модалка логина */
        #authModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #111;
            padding: 40px;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 20px 0;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">DESO<span>LATION</span></div>
            <button class="login-trigger" onclick="toggleModal(true)">LOGIN</button>
        </div>
    </nav>

    <div class="hero">
        <h1>Desolation</h1>
        <p>REDEFINING GAMEPLAY LIMITS</p>
    </div>

    <section class="pricing">
        <div class="card">
            <h3>RECURRING</h3>
            <div class="price">7 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547531" target="_blank" class="buy-btn">PURCHASE</a>
        </div>
        <div class="card">
            <h3>RECURRING</h3>
            <div class="price">30 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547515" target="_blank" class="buy-btn">PURCHASE</a>
        </div>
    </section>

    <div class="tg-section">
        <a href="https://t.me/desolationcheat" target="_blank" class="tg-link">JOIN TELEGRAM CHANNEL</a>
    </div>

    <div id="authModal">
        <div class="modal-content">
            <h2 style="font-size: 1.2rem; text-align: center;">AUTHORIZATION</h2>
            <input type="text" placeholder="License Key">
            <button class="login-trigger" style="width: 100%;" onclick="alert('Checking...')">CONNECT</button>
            <p style="text-align: center; margin-top: 20px; font-size: 0.7rem; color: #444; cursor: pointer;" onclick="toggleModal(false)">CLOSE</p>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            document.getElementById('authModal').style.display = show ? 'flex' : 'none';
        }
    </script>

</body>
</html>
