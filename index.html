<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desolation | Bankroll Mafia</title>
    <style>
        :root {
            --accent: #ff0000;
            --bg: #050505;
            --card-bg: #0a0a0a;
            --border: #141414;
            --text-dim: #555;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        nav {
            width: 100%;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            position: fixed;
            top: 0;
            z-index: 10;
        }

        .logo { font-weight: 900; letter-spacing: 5px; text-transform: uppercase; font-size: 1.1rem; }
        .logo span { color: var(--accent); }
        
        .client-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .client-btn:hover { opacity: 0.8; box-shadow: 0 0 20px rgba(255,0,0,0.2); }

        .hero {
            margin-top: 25vh;
            text-align: center;
            margin-bottom: 80px;
        }
        .hero h1 { font-size: 5.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: -2px; }
        .hero p { color: var(--text-dim); letter-spacing: 6px; font-size: 0.75rem; text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            width: 100%;
            max-width: 1000px;
            border: 1px solid var(--border);
            background: var(--border);
            gap: 1px;
        }
        .card {
            background: var(--card-bg);
            padding: 80px 40px;
            text-align: center;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover { background: #0d0d0d; }
        .card h3 { color: var(--text-dim); font-size: 0.65rem; letter-spacing: 3px; margin-bottom: 25px; }
        .card .val { font-size: 4rem; font-weight: 900; margin-bottom: 45px; }
        
        .buy-btn {
            display: block;
            text-decoration: none;
            color: #fff;
            border: 1px solid var(--border);
            padding: 18px;
            font-size: 0.75rem;
            font-weight: 700;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .buy-btn:hover { background: #fff; color: #000; border-color: #fff; }

        .footer-links {
            margin: 80px 0;
            display: flex;
            gap: 20px;
        }

        .tg-link {
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 1px solid var(--border);
            padding: 15px 45px;
            transition: 0.3s;
        }
        .tg-link:hover { border-color: var(--accent); color: var(--accent); }

        #modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.99);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            text-align: center;
        }
        .modal-content h2 { font-size: 1.2rem; letter-spacing: 6px; margin-bottom: 35px; color: var(--accent); }
        .modal-content input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            padding: 18px;
            color: #fff;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 0.8rem;
            text-align: center;
        }
        .modal-content input:focus { border-color: var(--accent); }
        .close-btn { color: var(--text-dim); cursor: pointer; font-size: 0.6rem; margin-top: 25px; text-transform: uppercase; letter-spacing: 2px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">DESO<span>LATION</span></div>
        <button class="client-btn" onclick="openModal()">Register</button>
    </nav>

    <div class="hero">
        <h1>Desolation</h1>
        <p>Project by Bankroll Mafia</p>
    </div>

    <div class="grid">
        <div class="card">
            <h3>SUBSCRIPTION</h3>
            <div class="val">7 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547531" class="buy-btn" target="_blank">GET ACCESS</a>
        </div>
        <div class="card">
            <h3>SUBSCRIPTION</h3>
            <div class="val">30 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547515" class="buy-btn" target="_blank">GET ACCESS</a>
        </div>
    </div>

    <div class="footer-links">
        <a href="https://t.me/desolationcheat" class="tg-link" target="_blank">Telegram</a>
    </div>

    <div id="modal">
        <div class="modal-content">
            <h2>INVITE SYSTEM</h2>
            <input type="text" id="username" placeholder="USERNAME">
            <input type="text" id="invite" placeholder="INVITE KEY">
            <button class="client-btn" style="width: 100%;" onclick="checkInvite()">Join the Mafia</button>
            <div class="close-btn" onclick="closeModal()">Return to shadows</div>
        </div>
    </div>

    <script>
        // Твои ключи
        const validInvites = [
            'DSLT-K92B-X10P', 
            'DSLT-M48R-ZQLW', 
            'DSLT-77VX-991A', 
            'DSLT-B002-HHX4', 
            'DSLT-PL81-KJS6'
        ];
        
        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function checkInvite() {
            const inviteInput = document.getElementById('invite').value.trim().toUpperCase();
            
            if (validInvites.includes(inviteInput)) {
                alert('Welcome to Bankroll Mafia. Registration successful.');
                closeModal();
            } else {
                alert('Invalid or expired invite key.');
            }
        }
    </script>
</body>
</html>
