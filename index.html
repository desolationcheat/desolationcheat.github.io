<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desolation | Performance Software</title>
    <style>
        :root {
            --accent: #ff0000;
            --bg: #080808;
            --panel: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Навигация */
        nav {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 20px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .logo {
            font-weight: 900;
            letter-spacing: 4px;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .logo span { color: var(--accent); }

        .login-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 24px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            transform: translateY(-1px);
        }

        /* Hero секция */
        .hero {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: radial-gradient(circle at 50% 50%, #150000 0%, var(--bg) 100%);
            padding: 0 20px;
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 10px;
            animation: fadeIn 1s ease-out;
        }

        .hero p {
            color: var(--text-dim);
            letter-spacing: 6px;
            font-size: 0.85rem;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease-out;
        }

        /* Карточки */
        .content {
            max-width: 1000px;
            margin: -100px auto 100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            padding: 0 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 50px 40px;
            border-radius: 4px;
            backdrop-filter: blur(5px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 0, 0, 0.5);
            transform: translateY(-8px);
        }

        .card h3 {
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .card .price {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 30px;
        }

        .card .buy-btn {
            display: block;
            text-decoration: none;
            color: #fff;
            border: 1px solid var(--border);
            padding: 16px;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
        }

        .card .buy-btn:hover {
            background: #fff;
            color: #000;
        }

        /* Секция Telegram */
        .tg-container {
            text-align: center;
            padding-bottom: 100px;
        }

        .tg-button {
            display: inline-block;
            text-decoration: none;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 15px 40px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .tg-button:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.5);
        }

        /* Модалка */
        #auth {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #111;
            padding: 60px 40px;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .modal input {
            width: 100%;
            padding: 15px;
            margin: 25px 0;
            background: #000;
            border: 1px solid var(--border);
            color: #fff;
            font-family: inherit;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">DESO<span>LATION</span></div>
            <button class="login-btn" onclick="modal(true)">CLIENT LOGIN</button>
        </div>
    </nav>

    <section class="hero">
        <h1>Desolation</h1>
        <p>REDEFINING THE STANDARDS</p>
    </section>

    <main class="content">
        <div class="card">
            <h3>WEEKLY ACCESS</h3>
            <div class="price">7 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547531" target="_blank" class="buy-btn">PURCHASE</a>
        </div>
        <div class="card">
            <h3>MONTHLY ACCESS</h3>
            <div class="price">30 DAYS</div>
            <a href="https://funpay.com/lots/offer?id=67547515" target="_blank" class="buy-btn">PURCHASE</a>
        </div>
    </main>

    <div class="tg-container">
        <a href="https://t.me/desolationcheat" target="_blank" class="tg-button">
            Join Telegram
        </a>
    </div>

    <div id="auth">
        <div class="modal">
            <h2 style="letter-spacing: 4px; font-size: 1rem;">AUTHORIZATION</h2>
            <input type="text" placeholder="License Key">
            <button class="login-btn" style="width: 100%;" onclick="alert('Checking key...')">CONNECT</button>
            <p style="margin-top: 25px; color: #444; font-size: 0.7rem; cursor: pointer;" onclick="modal(false)">[ BACK TO SITE ]</p>
        </div>
    </div>

    <script>
        function modal(v) { document.getElementById('auth').style.display = v ? 'flex' : 'none'; }
    </script>

</body>
</html>
