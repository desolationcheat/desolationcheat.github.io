<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desolation | Official</title>
    <style>
        :root {
            --accent: #ff4747;
            --bg: #050505;
            --panel: rgba(20, 20, 20, 0.7);
            --border: rgba(255, 71, 71, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Навигация */
        nav {
            position: fixed;
            top: 0; width: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
        }

        .logo {
            font-weight: 800;
            letter-spacing: 3px;
            font-size: 1.2rem;
            text-transform: uppercase;
        }

        .logo span { color: var(--accent); }

        .client-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            border-radius: 3px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .client-btn:hover {
            box-shadow: 0 0 20px rgba(255, 71, 71, 0.4);
            transform: translateY(-1px);
        }

        /* Главный блок */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding-top: 80px;
            background: radial-gradient(circle at center, #1a0808 0%, var(--bg) 70%);
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            margin-bottom: 5px;
            letter-spacing: -2px;
        }

        .hero p {
            color: #666;
            letter-spacing: 5px;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        /* Тарифы */
        .pricing {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            padding: 0 20px 60px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 45px 30px;
            border-radius: 5px;
            transition: 0.4s;
            text-align: center;
        }

        .card:hover {
            border-color: var(--accent);
            background: rgba(30, 30, 30, 0.8);
            transform: translateY(-5px);
        }

        .card h3 {
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .card .time {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .buy-link {
            display: block;
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 14px;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
            border-radius: 3px;
        }

        .buy-link:hover {
            background: #fff;
            color: #000;
        }

        /* Телеграм */
        .tg-box {
            padding-bottom: 80px;
            text-align: center;
        }

        .tg-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 15px 35px;
            border: 1px solid var(--accent);
            transition: 0.3s;
        }

        .tg-btn:hover {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 71, 71, 0.3);
        }

        /* Окно логина */
        #authModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #0a0a0a;
            border: 1px solid var(--border);
            padding: 50px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal input {
            width: 100%;
            padding: 15px;
            margin: 25px 0;
            background: #000;
            border: 1px solid #222;
            color: var(--accent);
            text-align: center;
            outline: none;
        }

        .close-modal {
            margin-top: 20px;
            color: #444;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <div class="logo">DESO<span>LATION</span></div>
            <button class="client-btn" onclick="toggle(true)">Client Login</button>
        </div>
    </nav>

    <section class="hero">
        <h1>Desolation</h1>
        <p>REDEFINING THE STANDARDS</p>

        <div class="pricing">
            <div class="card">
                <h3>WEEKLY ACCESS</h3>
                <div class="time">7 DAYS</div>
                <a href="https://funpay.com/lots/offer?id=67547531" target="_blank" class="buy-link">PURCHASE</a>
            </div>
            <div class="card">
                <h3>MONTHLY ACCESS</h3>
                <div class="time">30 DAYS</div>
                <a href="https://funpay.com/lots/offer?id=67547515" target="_blank" class="buy-link">PURCHASE</a>
            </div>
        </div>
    </section>

    <div class="tg-box">
        <a href="https://t.me/desolationcheat" target="_blank" class="tg-btn">Telegram Channel</a>
    </div>

    <div id="authModal">
        <div class="modal">
            <h2 style="letter-spacing: 3px; font-size: 1rem;">AUTHORIZATION</h2>
            <input type="text" placeholder="ENTER LICENSE KEY">
            <button class="client-btn" style="width: 100%;" onclick="alert('Checking...')">Connect</button>
            <div class="close-modal" onclick="toggle(false)">BACK TO SITE</div>
        </div>
    </div>

    <script>
        function toggle(show) {
            document.getElementById('authModal').style.display = show ? 'flex' : 'none';
        }
    </script>

</body>
</html>
