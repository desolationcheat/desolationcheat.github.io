    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Inter:wght@300;700&display=swap');

        :root { 
            --accent: #ff4d4d; 
            --bg: #080808; 
            --card-bg: #0f0f0f;
            --border: #1a1a1a; 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; min-height: 100vh; }

        /* Навигация */
        nav {
            position: fixed; top: 0; width: 100%; padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(8,8,8,0.8); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid var(--border);
        }
        .nav-logo { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 3px; font-size: 1.2rem; }
        .nav-logo span { color: var(--accent); }
        .tg-btn { text-decoration: none; border: 1px solid var(--accent); padding: 8px 15px; border-radius: 4px; color: var(--accent); font-size: 0.8rem; font-weight: 700; transition: 0.3s; }
        .tg-btn:hover { background: var(--accent); color: #fff; }

        /* Авторизация */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .auth-container { width: 100%; max-width: 400px; padding: 40px; text-align: center; }
        .auth-container h1 { font-family: 'Orbitron', sans-serif; margin-bottom: 30px; letter-spacing: 5px; font-size: 1.5rem; }
        
        .input-group input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border);
            padding: 15px; color: #fff; text-align: center; font-size: 0.9rem;
            letter-spacing: 1px; margin-bottom: 15px; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); }

        .action-btn {
            width: 100%; padding: 15px; background: var(--accent); border: none;
            color: #fff; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; cursor: pointer; transition: 0.3s; margin-bottom: 20px;
        }
        .action-btn:hover { background: #ff3333; }

        .switch-mode { color: #555; font-size: 0.8rem; cursor: pointer; text-decoration: underline; }
        .switch-mode:hover { color: #888; }

        /* Сайт */
        main { display: none; opacity: 0; flex-direction: column; align-items: center; padding: 120px 20px; transition: 1s; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; width: 100%; max-width: 1000px; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); padding: 50px 30px; text-align: center; }
        .buy-link { display: inline-block; width: 100%; padding: 15px; border: 1px solid var(--border); text-decoration: none; color: #fff; font-weight: 700; text-transform: uppercase; margin-top: 20px; transition: 0.3s; }
        .buy-link:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">DESO<span>LATION</span></div>
        <div class="nav-links">
            <a href="https://t.me/your_tg_channel" class="tg-btn" target="_blank">Telegram</a>
        </div>
    </nav>

    <section id="auth-screen">
        <div class="auth-container" id="login-form">
            <h1>LOGIN</h1>
            <div class="input-group">
                <input type="text" id="l-user" placeholder="USERNAME">
                <input type="password" id="l-pass" placeholder="PASSWORD">
            </div>
            <button class="action-btn" onclick="login()">Sign In</button>
            <p class="switch-mode" onclick="toggleAuth()">Don't have an account? Register</p>
        </div>

        <div class="auth-container" id="reg-form" style="display: none;">
            <h1>REGISTER</h1>
            <div class="input-group">
                <input type="text" id="r-user" placeholder="CHOOSE USERNAME">
                <input type="password" id="r-pass" placeholder="CREATE PASSWORD">
                <input type="text" id="r-invite" placeholder="INVITE CODE">
            </div>
            <button class="action-btn" onclick="register()">Create Account</button>
            <p class="switch-mode" onclick="toggleAuth()">Already registered? Login</p>
        </div>
    </section>

    <main id="main-content">
        <h2 style="font-family: 'Orbitron'; letter-spacing: 10px; margin-bottom: 50px;">DESOLATION</h2>
        <div class="product-grid">
            <div class="product-card">
                <h3>LITE</h3>
                <div style="color: var(--accent); font-size: 1.5rem; margin: 20px 0;">7 DAYS</div>
                <a href="https://funpay.com/lots/offer?id=67547531" class="buy-link" target="_blank">Purchase</a>
            </div>
            <div class="product-card">
                <h3>PRO</h3>
                <div style="color: var(--accent); font-size: 1.5rem; margin: 20px 0;">30 DAYS</div>
                <a href="https://funpay.com/lots/offer?id=67547515" class="buy-link" target="_blank">Purchase</a>
            </div>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
            authDomain: "desolationcheat.firebaseapp.com",
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",
            projectId: "desolationcheat",
            storageBucket: "desolationcheat.firebasestorage.app",
            messagingSenderId: "437522470275",
            appId: "1:437522470275:web:5b20d57e9907100ec712b6",
            measurementId: "G-Y6RX4X88K1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function toggleAuth() {
            const l = document.getElementById('login-form');
            const r = document.getElementById('reg-form');
            l.style.display = l.style.display === 'none' ? 'block' : 'none';
            r.style.display = r.style.display === 'none' ? 'block' : 'none';
        }

        function unlockSite() {
            document.getElementById('auth-screen').style.transform = 'translateY(-100%)';
            const main = document.getElementById('main-content');
            main.style.display = 'flex';
            setTimeout(() => { main.style.opacity = '1'; }, 100);
            document.body.style.overflow = 'auto';
        }

        async function register() {
            const user = document.getElementById('r-user').value.trim();
            const pass = document.getElementById('r-pass').value.trim();
            const invite = document.getElementById('r-invite').value.trim().toUpperCase();

            if(!user || !pass || !invite) return alert("Fill all fields");

            const invRef = db.ref('invites/' + invite);
            const userRef = db.ref('users/' + user);

            try {
                const invSnap = await invRef.get();
                const userSnap = await userRef.get();

                if (userSnap.exists()) return alert("Username already taken");
                if (invSnap.exists() && invSnap.val() === true) {
                    // Создаем юзера
                    await userRef.set({ password: pass, registered: new Date().toLocaleString() });
                    // Сжигаем инвайт
                    await invRef.set(false);
                    alert("Account created! Now login.");
                    toggleAuth();
                } else {
                    alert("Invalid or used invite code");
                }
            } catch(e) { alert("Error connecting to DB"); }
        }

        async function login() {
            const user = document.getElementById('l-user').value.trim();
            const pass = document.getElementById('l-pass').value.trim();

            if(!user || !pass) return alert("Fill all fields");

            try {
                const snap = await db.ref('users/' + user).get();
                if (snap.exists() && snap.val().password === pass) {
                    unlockSite();
                } else {
                    alert("Invalid username or password");
                }
            } catch(e) { alert("Error connecting to DB"); }
        }
    </script>
</body>
</html>
