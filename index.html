    <style>
        /* 
           EXTENDED UI FRAMEWORK 
           BASED ON MIMGUI PASTEL PINK DESIGN SYSTEM
        */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@300;500&display=swap');

        :root {
            --neon-pink: #ffb6c1;
            --dark-bg: #030303;
            --panel: #0a0a0a;
            --brd: #151515;
            --glow: 0 0 20px rgba(255, 182, 193, 0.35);
            --heavy-glow: 0 0 50px rgba(255, 182, 193, 0.6);
            --pink-transparent: rgba(255, 182, 193, 0.1);
            --transition-speed: 0.4s;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            cursor: crosshair; 
            font-family: 'Orbitron', sans-serif; 
            scrollbar-width: thin;
            scrollbar-color: var(--neon-pink) transparent;
        }

        body { 
            background: var(--dark-bg); 
            color: #ffffff; 
            overflow: hidden; 
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        /* INTRO ANIMATION LAYER */
        #intro-overlay {
            position: fixed; 
            inset: 0; 
            background: #000; 
            z-index: 10000;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            transition: opacity 1.2s ease-in-out;
        }

        .intro-glitch-container {
            position: relative;
        }

        .intro-title {
            font-size: 5rem; 
            color: var(--neon-pink); 
            text-shadow: var(--heavy-glow);
            letter-spacing: 20px; 
            font-weight: 900;
            text-align: center;
            position: relative;
            animation: introPulse 2s infinite ease-in-out;
        }

        .intro-subtitle {
            font-family: 'JetBrains+Mono', monospace;
            font-size: 0.8rem;
            color: #444;
            letter-spacing: 10px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        @keyframes introPulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* AUTHENTICATION MODULE */
        #auth-page { 
            position: fixed; 
            inset: 0; 
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%); 
            z-index: 5000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .auth-container {
            position: relative;
            width: 600px;
            padding: 5px;
            background: linear-gradient(45deg, transparent, var(--brd), transparent);
        }

        .auth-card { 
            background: var(--panel); 
            border: 1px solid var(--brd); 
            padding: 70px 50px; 
            width: 100%; 
            text-align: center; 
            box-shadow: var(--glow); 
            position: relative;
            z-index: 5;
        }
        
        .auth-header { 
            font-size: 1.6rem; 
            margin-bottom: 50px; 
            color: var(--neon-pink); 
            text-shadow: var(--glow); 
            letter-spacing: 5px; 
            font-weight: 900;
            text-transform: uppercase;
        }
        
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #333;
            font-size: 0.9rem;
        }

        input { 
            width: 100%; 
            background: #000; 
            border: 1px solid #1a1a1a; 
            padding: 22px 22px 22px 55px; 
            color: #fff; 
            font-size: 0.8rem; 
            letter-spacing: 3px;
            outline: none;
            transition: var(--transition-speed);
            text-transform: uppercase;
        }

        input:focus { 
            border-color: var(--neon-pink); 
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.15); 
            background: #050505; 
        }
        
        /* ОБНОВЛЕННЫЕ АНИМАЦИИ КНОПОК */
        .main-btn { 
            width: 100%; 
            padding: 22px; 
            background: var(--neon-pink); 
            color: #000; 
            border: none; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 1rem; 
            letter-spacing: 3px; 
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1); /* Плавный переход */
        }

        .main-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .main-btn:hover::after {
            left: 100%;
            top: 100%;
        }

        .main-btn:hover { 
            box-shadow: var(--heavy-glow); 
            transform: translateY(-3px) scale(1.02); /* Легкое увеличение и подъем */
            filter: brightness(1.1);
        }

        .main-btn:active {
            transform: translateY(-1px) scale(0.98); /* Эффект нажатия */
        }

        .auth-footer-links {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .auth-link {
            font-size: 0.6rem; 
            color: #333; 
            letter-spacing: 2px; 
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            text-transform: uppercase;
        }

        .auth-link:hover {
            color: var(--neon-pink);
        }

        /* MAIN DASHBOARD INTERFACE */
        nav {
            position: fixed; 
            top: 0; 
            width: 100%; 
            padding: 35px 80px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: rgba(0,0,0,0.98); 
            border-bottom: 1px solid var(--brd); 
            z-index: 2000;
        }

        .logo { 
            font-size: 2rem; 
            color: var(--neon-pink); 
            text-shadow: var(--heavy-glow); 
            font-weight: 900; 
            letter-spacing: 6px; 
            cursor: pointer;
        }

        .nav-links { 
            display: flex; 
            gap: 50px; 
            align-items: center; 
        }

        .nav-link { 
            cursor: pointer; 
            color: #444; 
            font-size: 0.8rem; 
            text-decoration: none; 
            font-weight: 800; 
            letter-spacing: 3px;
            display: flex; 
            align-items: center; 
            gap: 12px;
            position: relative;
            transition: color 0.3s ease; /* Плавная смена цвета */
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--neon-pink);
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .nav-link:hover, .nav-link.active { 
            color: var(--neon-pink); 
            text-shadow: var(--glow); 
        }

        .lang-switch { 
            display: flex; 
            gap: 30px; 
            margin-left: 30px; 
            border-left: 1px solid #1a1a1a; 
            padding-left: 30px; 
        }

        .flag-container { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 6px; 
            cursor: pointer; 
        }

        .flag-box {
            width: 32px; 
            height: 20px; 
            border: 1px solid #222;
            filter: grayscale(100%);
            transition: 0.5s;
        }

        .flag-container.active .flag-box {
            filter: grayscale(0%);
            box-shadow: 0 0 15px var(--neon-pink); 
            border-color: var(--neon-pink);
            transform: scale(1.1);
        }

        .flag-label { font-size: 0.6rem; color: #333; font-weight: 900; }
        .flag-container.active .flag-label { color: var(--neon-pink); }

        .f-ru { background: #fff; position: relative; }
        .f-ru::before { content: ""; position: absolute; top: 33.3%; left: 0; width: 100%; height: 33.3%; background: #0039a6; }
        .f-ru::after { content: ""; position: absolute; bottom: 0; left: 0; width: 100%; height: 33.3%; background: #d52b1e; }

        .f-en { background: #00247d; position: relative; overflow: hidden; }
        .f-en::before { content: ""; position: absolute; top: 0; left: 42%; width: 16%; height: 100%; background: #fff; z-index: 1; }
        .f-en::after { content: ""; position: absolute; top: 40%; left: 0; width: 100%; height: 20%; background: #fff; z-index: 1; }
        .f-en-red-h { position: absolute; top: 45%; left: 0; width: 100%; height: 10%; background: #cf142b; z-index: 2; }
        .f-en-red-v { position: absolute; top: 0; left: 46%; width: 8%; height: 100%; background: #cf142b; z-index: 2; }

        /* CONTENT WRAPPER */
        main { 
            display: none; 
            padding: 180px 80px 80px; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            overflow-y: auto; 
            background: radial-gradient(circle at 50% 0%, rgba(255, 182, 193, 0.03) 0%, transparent 70%);
        }

        .content-box { width: 100%; max-width: 1300px; animation: fadeInUp 0.8s ease; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MANIFESTO / HOME PAGE */
        .manifesto-card {
            background: var(--panel);
            border: 1px solid var(--brd);
            padding: 80px;
            box-shadow: var(--glow);
            position: relative;
            overflow: hidden;
        }

        .manifesto-card::before {
            content: 'DESOLATION';
            position: absolute;
            bottom: -20px;
            right: -20px;
            font-size: 10rem;
            font-weight: 900;
            color: rgba(255,255,255,0.01);
            pointer-events: none;
        }

        .manifesto-header {
            font-size: 2rem;
            color: var(--neon-pink);
            margin-bottom: 40px;
            letter-spacing: 5px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .manifesto-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #777;
            line-height: 2.2;
            text-align: justify;
            max-width: 900px;
        }

        /* PRICE CARDS */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 40px;
        }

        .price-card {
            background: var(--panel);
            border: 1px solid var(--brd);
            padding: 50px 30px;
            text-align: center;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .price-card:hover {
            border-color: var(--neon-pink);
            transform: translateY(-10px);
            box-shadow: var(--glow);
        }

        .price-card i {
            font-size: 3rem;
            color: var(--neon-pink);
            margin-bottom: 30px;
            display: block;
        }

        .price-card .term {
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .price-card .cost {
            font-family: 'JetBrains Mono', monospace;
            color: #555;
            font-size: 1rem;
        }

        /* PROFILE SECTION */
        .profile-layout {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 50px;
        }

        .profile-aside {
            background: var(--panel);
            border: 1px solid var(--brd);
            padding: 60px 40px;
            text-align: center;
            box-shadow: var(--glow);
        }

        .avatar-container {
            width: 180px;
            height: 180px;
            border: 2px solid var(--neon-pink);
            margin: 0 auto 40px;
            position: relative;
            padding: 10px;
            border-radius: 5px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }

        .avatar-edit-trigger {
            position: absolute;
            bottom: -15px;
            right: -15px;
            background: var(--neon-pink);
            color: #000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--glow);
            transition: 0.3s;
        }

        .avatar-edit-trigger:hover {
            transform: rotate(90deg) scale(1.1);
        }

        .user-title {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: var(--heavy-glow);
            text-transform: uppercase;
        }

        .uid-tag {
            background: var(--pink-transparent);
            color: var(--neon-pink);
            padding: 8px 20px;
            font-size: 0.7rem;
            letter-spacing: 4px;
            display: inline-block;
            border: 1px solid rgba(255,182,193,0.2);
        }

        .profile-main-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .info-tile {
            background: var(--panel);
            border: 1px solid var(--brd);
            padding: 35px;
            position: relative;
            overflow: hidden;
        }

        .info-tile label {
            display: block;
            color: #333;
            font-size: 0.6rem;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .info-tile .value {
            font-size: 1.1rem;
            color: #ddd;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .info-tile.highlight .value {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.3);
        }

        .invites-section {
            grid-column: span 2;
            background: var(--panel);
            border: 1px solid var(--brd);
            padding: 50px;
            margin-top: 10px;
        }

        .token-display {
            background: #000;
            padding: 30px;
            margin: 30px 0;
            border: 1px dashed #222;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            color: var(--neon-pink);
            font-size: 0.9rem;
        }

        .token-item {
            padding: 5px 15px;
            background: rgba(255,255,255,0.02);
            border-radius: 3px;
        }

        /* UTILS */
        .hidden { display: none !important; }
        .pink-text { color: var(--neon-pink); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--neon-pink); }

        /* NOTIFICATION SYSTEM */
        #notifier {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 9999;
        }

        .toast {
            background: var(--panel);
            border: 1px solid var(--neon-pink);
            color: #fff;
            padding: 20px 40px;
            margin-top: 15px;
            font-size: 0.75rem;
            letter-spacing: 2px;
            box-shadow: var(--glow);
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>

                        <div class="token-display" id="display-tokens">NO TOKENS FOUND</div>
                        <div style="display: flex; gap: 20px;">
                            <button class="main-btn" id="gen-token-btn" style="background: transparent; border: 1px solid var(--neon-pink); color: var(--neon-pink); font-size: 0.7rem; padding: 15px;" onclick="generateInvite()">GENERATE NEW TOKEN</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="notifier"></div>

    <script>
        /**
         * FIREBASE CORE CONFIGURATION
         */
        const firebaseConfig = { 
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0", 
            authDomain: "desolationcheat.firebaseapp.com", 
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com", 
            projectId: "desolationcheat" 
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // GLOBAL STATE
        let currentUser = null;
        let currentUID = "";
        let isTypingManifesto = false;

        const localization = {
            RU: {
                authL: "DESOLATION | ВХОД",
                authR: "DESOLATION | РЕГИСТРАЦИЯ",
                navHome: "ГЛАВНАЯ",
                navProfile: "ПРОФИЛЬ",
                manifesto: "МАНИФЕСТ ПРОГРАММЫ",
                desc: "Desolation — это не просто софт, это инструмент тотального контроля. Разработанный для SAMP, наш проект объединяет в себе передовые технологии: кастомный Silent Aim, отрисованный через векторы для идеальной точности, и Wallshot, игнорирующий коллизии. ESP написан на низкоуровневом mimgui с использованием пастельно-розовой неоновой палитры. Каждая строчка кода оптимизирована под высокую частоту кадров. Твой успех — наш приоритет.",
                rank: "УРОВЕНЬ ДОСТУПА",
                status: "СТАТУС ЛИЦЕНЗИИ",
                joined: "ДАТА РЕГИСТРАЦИИ",
                hardware: "СИНХРОНИЗАЦИЯ",
                invites: "ГЕНЕРИРОВАННЫЕ КЛЮЧИ",
                bossRank: "NONE",
                userRank: "ПОЛЬЗОВАТЕЛЬ",
                activeStatus: "АКТИВНА",
                unlimited: "БЕССРОЧНО",
                toastLog: "СЕССИЯ ИНИЦИАЛИЗИРОВАНА",
                toastErr: "ОШИБКА ДОСТУПА",
                toastReg: "ЛИЧНОСТЬ СОЗДАНА"
            },
            EN: {
                authL: "DESOLATION | LOGIN",
                authR: "DESOLATION | REGISTER",
                navHome: "DASHBOARD",
                navProfile: "PROFILE",
                manifesto: "SOFTWARE MANIFESTO",
                desc: "Desolation is more than software; it's a tool of total control. Engineered for SAMP, our project integrates advanced technologies: custom vector-based Silent Aim for clinical precision and Wallshot bypassing collisions. The ESP is built on low-level mimgui using a pastel pink neon palette. Every line of code is optimized for high framerates. Your success is our mission.",
                rank: "SECURITY CLEARANCE",
                status: "LICENSE STATUS",
                joined: "RECORDS CREATED",
                hardware: "HARDWARE SYNC",
                invites: "GENERATED ACCESS TOKENS",
                bossRank: "NONE",
                userRank: "AUTHORIZED USER",
                activeStatus: "VERIFIED",
                unlimited: "UNLIMITED",
                toastLog: "SESSION INITIALIZED",
                toastErr: "ACCESS DENIED",
                toastReg: "IDENTITY CREATED"
            }
        };

        // UI HELPERS
        function notify(msg) {
            const container = document.getElementById('notifier');
            const div = document.createElement('div');
            div.className = 'toast';
            div.innerText = msg;
            container.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        function toggleAuth(isReg) {
            document.getElementById('login-form').classList.toggle('hidden', isReg);
            document.getElementById('reg-form').classList.toggle('hidden', !isReg);
            document.getElementById('auth-h').innerText = isReg ? localization.EN.authR : localization.EN.authL;
        }

        function switchTab(tab) {
            document.getElementById('view-home').classList.toggle('hidden', tab !== 'home');
            document.getElementById('view-profile').classList.toggle('hidden', tab !== 'profile');
            document.getElementById('tab-home').classList.toggle('active', tab === 'home');
            document.getElementById('tab-profile').classList.toggle('active', tab === 'profile');
        }

        // LANGUAGE LOGIC
        function changeLanguage(lang) {
            const data = localization[lang];
            document.getElementById('lang-ru').classList.toggle('active', lang === 'RU');
            document.getElementById('lang-en').classList.toggle('active', lang === 'EN');
            
            document.getElementById('txt-n-home').innerText = data.navHome;
            document.getElementById('txt-n-profile').innerText = data.navProfile;
            document.getElementById('txt-m-title').innerText = data.manifesto;
            document.getElementById('lbl-rank').innerText = data.rank;
            document.getElementById('lbl-status').innerText = data.status;
            document.getElementById('lbl-joined').innerText = data.joined;
            document.getElementById('lbl-hardware').innerText = data.hardware;
            document.getElementById('lbl-invites').innerText = data.invites;

            const desc = document.getElementById('txt-m-desc');
            if(!isTypingManifesto) {
                isTypingManifesto = true;
                desc.innerText = "";
                let i = 0;
                function type() {
                    if(i < data.desc.length) {
                        desc.innerHTML += data.desc.charAt(i);
                        i++;
                        setTimeout(type, 10);
                    } else { isTypingManifesto = false; }
                }
                type();
            } else {
                desc.innerText = data.desc;
            }

            if(currentUser) {
                const isBoss = (currentUID === 'ryodeu' || currentUID === 'dev' || currentUser.rank === 'None');
                document.getElementById('display-rank').innerText = isBoss ? data.bossRank : data.userRank;
                document.getElementById('display-status').innerText = isBoss ? data.unlimited : data.activeStatus;
            }
        }

        // AUTHENTICATION CORE
        async function handleLogin() {
            const u = document.getElementById('l-user').value.toLowerCase().trim();
            const p = document.getElementById('l-pass').value.trim();
            if(!u || !p) return;

            const snap = await db.ref('users/' + u).get();
            if(snap.exists() && snap.val().password === p) {
                currentUID = u;
                currentUser = snap.val();
                notify(localization.EN.toastLog);
                document.getElementById('auth-page').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-page').style.display = 'none';
                    document.getElementById('main-app').style.display = 'flex';
                    syncProfile();
                }, 800);
            } else {
                notify(localization.EN.toastErr);
            }
        }

        async function handleRegister() {
            const u = document.getElementById('r-user').value.toLowerCase().trim();
            const p = document.getElementById('r-pass').value.trim();
            const i = document.getElementById('r-inv').value.trim();
            if(!u || !p || !i) return;

            const invSnap = await db.ref('invites/' + i).get();
            if(invSnap.exists() && invSnap.val().active) {
                const countSnap = await db.ref('stats/userCount').get();
                const count = countSnap.val() || 0;
                
                const newUser = {
                    password: p,
                    date: new Date().toLocaleDateString(),
                    uid: count + 1,
                    rank: "USER",
                    invs: [],
                    avatar: "https://i.imgur.com/6VBx3io.png",
                    monthly_count: 0,
                    last_gen_month: ""
                };

                await db.ref('users/' + u).set(newUser);
                await db.ref('invites/' + i).update({ active: false, used_by: u });
                await db.ref('stats/userCount').set(count + 1);
                
                notify(localization.EN.toastReg);
                toggleAuth(false);
            } else {
                notify("INVALID INVITATION TOKEN");
            }
        }

        // PROFILE LOGIC
        function syncProfile() {
            document.getElementById('display-username').innerText = currentUID;
            document.getElementById('display-uid').innerText = String(currentUser.uid).padStart(4, '0');
            document.getElementById('display-joined').innerText = currentUser.date;
            document.getElementById('display-avatar').src = currentUser.avatar || "https://i.imgur.com/6VBx3io.png";
            
            const isBoss = (currentUID === 'ryodeu' || currentUID === 'dev' || currentUser.rank === 'None');
            document.getElementById('boss-rename-btn').classList.toggle('hidden', !isBoss);
            
            const tokenBox = document.getElementById('display-tokens');
            const tokens = currentUser.invs || [];
            if(tokens.length > 0) {
                tokenBox.innerHTML = tokens.map(t => `<span class="token-item">${t}</span>`).join('');
            } else {
                tokenBox.innerText = "NO ACTIVE TOKENS";
            }

            changeLanguage('RU');
        }

        function uploadAvatar(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const b64 = e.target.result;
                    await db.ref('users/' + currentUID).update({ avatar: b64 });
                    currentUser.avatar = b64;
                    document.getElementById('display-avatar').src = b64;
                    notify("BIOMETRIC DATA UPDATED");
                };
                reader.readAsDataURL(file);
            }
        }

        /**
         * ОГРАНИЧЕНИЕ ГЕНЕРАЦИИ (2 в месяц)
         */
        async function generateInvite() {
            const now = new Date();
            const currentMonthYear = now.getMonth() + "-" + now.getFullYear();
            
            // Проверка смены месяца
            if (currentUser.last_gen_month !== currentMonthYear) {
                currentUser.monthly_count = 0;
                currentUser.last_gen_month = currentMonthYear;
            }

            // Лимит 2 инвайта
            if (currentUser.monthly_count >= 2) {
                notify("LIMIT REACHED: 2 TOKENS PER MONTH");
                return;
            }

            const code = "BANK-" + Math.random().toString(36).substring(2, 9).toUpperCase();
            await db.ref('invites/' + code).set({ active: true, gen_by: currentUID });
            
            let list = currentUser.invs || [];
            list.push(code);
            currentUser.monthly_count++;

            await db.ref('users/' + currentUID).update({ 
                invs: list, 
                monthly_count: currentUser.monthly_count,
                last_gen_month: currentMonthYear
            });
            
            syncProfile();
            notify("TOKEN GENERATED (" + currentUser.monthly_count + "/2)");
        }

        async function adminRename() {
            const newName = prompt("ENTER NEW IDENTITY:").toLowerCase().trim();
            if(newName && newName !== currentUID) {
                const check = await db.ref('users/' + newName).get();
                if(!check.exists()) {
                    await db.ref('users/' + newName).set(currentUser);
                    await db.ref('users/' + currentUID).remove();
                    location.reload();
                }
            }
        }

        function logout() {
            location.reload();
        }

        // STARTUP SCRIPT
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('intro-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('intro-overlay').style.display = 'none';
                }, 1200);
            }, 2500);
        };
    </script>
</body>
</html>
