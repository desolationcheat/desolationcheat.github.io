        :root {

        /* Навигация */
        nav {

            display: flex; justify-content: space-between; align-items: center;
            background: rgba(8,8,8,0.8); backdrop-filter: blur(10px);

        }

        .nav-logo { font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: 3px; font-size: 1.2rem; }
        .nav-logo span { color: var(--accent); }

        /* Экран авторизации */

            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-container { width: 100%; max-width: 400px; padding: 40px; text-align: center; }
        .auth-container h1 { font-family: 'Orbitron', sans-serif; margin-bottom: 40px; letter-spacing: 10px; font-size: 1.5rem; }
        
        .input-group { position: relative; margin-bottom: 25px; }
        .input-group input {
            width: 100%; background: var(--card-bg); border: 1px solid var(--border);
            padding: 15px; color: #fff; text-align: center; font-size: 1rem;
            letter-spacing: 2px; transition: 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(255,77,77,0.1); }

        .login-btn {
            width: 100%; padding: 15px; background: var(--accent); border: none;
            color: #fff; font-weight: 900; text-transform: uppercase;
            letter-spacing: 3px; cursor: pointer; transition: 0.3s;
        }
        .login-btn:hover { letter-spacing: 5px; background: #ff3333; }

        /* Главный контент */
        main { 
            display: none; opacity: 0; flex-direction: column; align-items: center; 
            padding: 120px 20px; transition: 1s; 
        }

        .hero-section { text-align: center; margin-bottom: 80px; }
        .hero-section h2 { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; letter-spacing: 15px; margin-bottom: 10px; }
        .hero-section p { color: #555; text-transform: uppercase; letter-spacing: 5px; font-size: 0.9rem; }

        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px; width: 100%; max-width: 1000px;
        }

        .product-card {
            background: var(--card-bg); border: 1px solid var(--border);
            padding: 50px 30px; text-align: center; transition: 0.4s;
            position: relative; overflow: hidden;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-5px); }
        .product-card h3 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; margin-bottom: 15px; }
        .price { font-size: 2rem; font-weight: 900; margin-bottom: 30px; color: var(--accent); }
        
        .buy-link {
            display: inline-block; width: 100%; padding: 15px;
            border: 1px solid var(--border); text-decoration: none;
            color: #fff; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; transition: 0.3s;
        }
        .buy-link:hover { background: #fff; color: #000; }

        .status { position: absolute; top: 15px; right: 15px; font-size: 0.6rem; color: #00ff00; letter-spacing: 1px; }

<body>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBRZVIbOEQtnl4twGv_VK6XUlMK0w5RgX0",
            authDomain: "desolationcheat.firebaseapp.com",
            databaseURL: "https://desolationcheat-default-rtdb.firebaseio.com",

            storageBucket: "desolationcheat.firebasestorage.app",
            messagingSenderId: "437522470275",

            measurementId: "G-Y6RX4X88K1"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function handleAuth() {
            const btn = document.querySelector('.login-btn');
            const key = document.getElementById('invite-input').value.trim().toUpperCase();
            
            if (!key) return;

            btn.innerHTML = "VERIFYING...";
            const ref = db.ref('invites/' + key);

            try {
                const snap = await ref.get();
                
                if (snap.exists() && snap.val() === true) {
                    await ref.set(false); // Деактивация ключа
                    
                    // Лог входа
                    await db.ref('users').push().set({
                        key: key,
                        timestamp: new Date().toLocaleString()
                    });

                    // Успешный вход
                    document.getElementById('auth-screen').style.transform = 'translateY(-100%)';
                    const main = document.getElementById('main-content');
                    main.style.display = 'flex';
                    setTimeout(() => { main.style.opacity = '1'; }, 100);
                    document.body.style.overflow = 'auto';
                } else {
                    alert('INVALID LICENSE KEY');
                    btn.innerHTML = "ENTER SYSTEM";
                }
            } catch (e) {
                alert('CONNECTION ERROR');
                btn.innerHTML = "ENTER SYSTEM";
